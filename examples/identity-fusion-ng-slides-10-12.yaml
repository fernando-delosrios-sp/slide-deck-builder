title: "Identity Fusion NG"
goal: "Give newcomers the value and mental model of Identity Fusion NG: why it exists, how Map-Define-Match works, who participates, and how to run it."
options:
  language: "en"
  audience: "New to the product; an SME presents from the notes"
  tone: "Technical and educational"
  length: "long"
slides:
  - slide_number: 10
    layout: "Two Content"
    role: "deep_dive"
    title: "Where do humans fit in?"
    subtitle: "Reviews are decisions, reports are analysis"
    content:
      regions:
        - id: "left"
          kind: "text"
          bullets:
            - "A review form shows the top candidates and their attributes to assigned reviewers."
            - "Reviewers link to an existing identity or create a new one; the decision applies on the next aggregation."
        - id: "right"
          kind: "text"
          bullets:
            - "Reviewers are source owners acting globally or per-source reviewer entitlements."
            - "Fusion reports preview outcomes for analysis and never decide anything."
      diagram:
        kind: "flow"
        elements:
          - "Review form"
          - "Assigned reviewer"
          - "Decision: link or create"
          - "Next aggregation"
        connections:
          - "Review form -> assigned reviewer -> decision -> next aggregation"
        emphasis: "The decision takes effect on the next aggregation, not immediately."
    notes: "Statuses this leaves behind: activeReviews, candidate, authorized, manual, auto. Matching only runs when automatic merge is on, or manual review is on with valid reviewers; otherwise borderline scores register as non-matched."

  - slide_number: 11
    layout: "Title and Content"
    role: "deep_dive"
    title: "How is correlation different from matching?"
    subtitle: "Matching asks who this is; correlation is the ISC link"
    content:
      bullets:
        - "You cannot link an account to an identity that does not exist yet, so Fusion creates it first."
        - "Correlate on aggregation: Fusion links missing accounts directly during the run."
        - "Reverse correlation: Fusion writes an attribute that native ISC rules consume instead."
        - "Do not correlate: stage the linking work; matching keeps working without it."
      diagram:
        kind: "comparison"
        elements:
          - "Matching: decides who this account is"
          - "Correlation: links the account to an ISC identity"
          - "Mode: correlate on aggregation"
          - "Mode: reverse correlation"
          - "Mode: do not correlate"
        connections:
          - "Matching -> identity exists -> correlation"
        emphasis: "Matching decides, correlation links."
    notes: "Correlation calls are expensive, so many projects stage them during initial load. Reverse correlation needs optimised aggregation switched off. An enforced correlation role can do the linking later."

  - slide_number: 12
    layout: "Two Content"
    role: "architecture"
    title: "What does a Fusion account give an operator?"
    subtitle: "Standard attributes, entitlements, and fresh source data"
    content:
      regions:
        - id: "left"
          kind: "text"
          bullets:
            - "Standard attributes trace provenance: contributing accounts, sources, origin, and history."
            - "Native identity and account name are set at creation and never rewritten."
        - id: "right"
          kind: "text"
          bullets:
            - "Status entitlements are calculated by the connector; action entitlements are requestable in ISC."
            - "Source data can be aggregated before processing, after a delay, or not at all."
      diagram:
        kind: "hierarchy"
        elements:
          - "Fusion account"
          - "Provenance: contributing accounts, sources, origin, history"
          - "Status entitlements: calculated"
          - "Action entitlements: requestable"
        emphasis: "One account record carries provenance and both entitlement families."
    notes: "Status entitlements make tenant-wide searches easy: what was created this run, what is in review, who the reviewers are, what stayed non-matched. Use a UUID when you need a truly immutable identifier."

