  content:
    diagram:
      kind: svg
      src: assets/diagram_reading_from_hr.svg
      title: Authoritative Ingestion Architecture
    body: Authoritative systems serve as Systems of Record. The ingestion pipeline reads raw source data (id, firstName, lastName,
      email, active, location, country, ssn), generates account objects, applies identity mappings, and populates the central
      identity.
  notes: 'Baseline Slide 4 details the authoritative ingestion flow. Presenter note: Authoritative Source = Systems of Record.
    Demonstrates the worked example mapping HR attributes to standard identity attributes for user John Cooper (jcooper).'
