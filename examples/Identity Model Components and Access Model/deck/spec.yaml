  badge: Deprovisioning
  title: Access Removal via Role & Edge Cases
  subtitle: Understanding automated deprovisioning triggers and critical non-deprovisioning behaviors
  content:
    cards:
    - title: Deprovisioning Triggers
      badge: Automated Removal
      icon: user-check
      body: Role-based deprovisioning removes entitlements when criteria no longer match or user is removed from identity list.
    - title: Role Editing Edge Case
      badge: Critical Behavior
      icon: shield-alert
      body: No deprovisioning is triggered when a Role is edited to remove an Access Profile; granted access remains intact.
    - title: Role Deletion Behavior
      badge: Critical Behavior
      icon: shield-alert
      body: Deleting a Role does NOT deprovision access previously assigned through it; target accounts retain permissions.
    - title: Explicit Cleanup Required
      badge: Governance Action
      icon: refresh-cw
      body: Removal requires explicit de-assignment or lifecycle transition to trigger target account deprovisioning.
  notes: 'Baseline Slide 30 highlights critical deprovisioning gotchas: editing a role to remove an access profile leaves
    existing access intact; deleting a role does NOT automatically deprovision granted access.'
