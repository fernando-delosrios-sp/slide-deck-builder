- slide_number: 5
  layout: Four Tiles
  role: process
  baseline_slides:
  - 5
  badge: Setup Sequence
  title: Building Identities
  subtitle: Four-step administrative workflow for establishing authoritative identity ingestion
  content:
    cards:
    - title: 1. Create Authoritative Source
      badge: Connections
      icon: database
      body: Navigate to Admin > Connections > Sources > +New. Establish connection parameters and service account credentials
        to the primary HR system of record.
    - title: 2. Create Identity Profile
      badge: Identities
      icon: user-plus
      body: Navigate to Admin > Identities > Identity Profiles > +New. Generate the governance template that binds source
        accounts to identity records.
    - title: 3. Configure Identity Profile
      badge: Policy & Mappings
      icon: sliders
      body: Associate Identity Profile with Source. Define identity mappings, transform logic, sign-in methods, and authentication
        policies.
    - title: 4. Aggregate Accounts
      badge: Data Import
      icon: refresh-cw
      body: Navigate to Admin > Connections > Sources > Import Data tab > Import Accounts. Ingest source records to trigger
        initial identity generation.
  notes: 'Baseline Slide 5 outlines the step-by-step procedural sequence to build identities in IdentityNow: create source,
    create profile, configure mappings, aggregate accounts.'
  additions:
  - Sequence
- slide_number: 6
  layout: Four Tiles
  role: architecture
  baseline_slides:
  - 6
  badge: Governance Rules
  title: Identity Profiles
  subtitle: Core governance configuration rules and priority ordering mechanics
  content:
    cards:
    - title: Identity Template & Policy
      badge: Foundation
      icon: file-text
      body: An identity profile is a template for creating identities, and a central place where identity policy is defined.
    - title: Identity Type Alignment
      badge: Personas
      icon: users
      body: Commonly aligned to identity type (e.g. Employees, Contractors, Students, Faculty) to define distinct lifecycle paths.
    - title: Single-Profile Assignment
      badge: Exclusivity
      icon: user-check
      body: An identity can only be assigned by a single identity profile at any given time. Configured in Admin > Identities > Identity Profiles.
    - title: Priority & Ordering
      badge: Precedence
      icon: list-ordered
      body: Enforces implicit priority / ordering in the user interface. Precedence can also be adjusted programmatically via REST APIs.
  notes: 'Baseline Slide 6 defines the strict single-profile constraint: an identity can only be assigned by one identity
    profile. Highlight that ordering in the UI dictates precedence during account evaluation.'
  additions:
  - Alignment
  - APIs
