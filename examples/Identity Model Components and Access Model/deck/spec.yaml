  badge: SailPoint IdentityNow Architecture
  title: Building Access in IdentityNow
  subtitle: Identity Model Components and Access Model
  content:
    image:
      src: assets/hero_cover.png
      alt: SailPoint Identity Security Core
      caption: SailPoint Identity Security Core Architecture
    body: A comprehensive architectural blueprint detailing identity generation, profile configuration, account correlation,
      access modeling, role engineering, and dynamic lifecycle governance.
    presenter: Enterprise IAM Architecture Team
    date: '2026'
  notes: 'Welcome to Building Access in IdentityNow: Identity Model Components and Access Model. This presentation provides
    an end-to-end technical breakdown of how identities are modeled, aggregated from authoritative sources, correlated with
    target accounts, structured into access profiles and roles, and dynamically governed through lifecycle state transitions.'
  additions:
  - Architecture
  - Core
  - Team
- slide_number: 2
  layout: Three Columns
  role: architecture
  baseline_slides:
  - 2
  redrawn_media:
  - image15.png
  - image17.png
  - image19.png
  badge: Core Entities
  title: Identity Model Components
  subtitle: The fundamental building blocks governing digital persona and target system permissions
  content:
    cards:
    - title: Identity
      badge: Who You Are
      icon: user
      body: A representation of a person or service and all the information associated with them. This includes security-relevant
        information as well as current status in the organization.
    - title: Account
      badge: Where You Exist
      icon: key
      body: A representation of an identity on a source system. This user account contains information about the identity
        and may also contain accesses as well.
    - title: Access
      badge: What You Can Do
      icon: shield
      body: Securities which grant accounts an ability to perform actions. They define what a user can and can't do in a system.
        On a source these may be known as entitlements, authorizations, groups, rights, permissions. Access can also be defined
        through roles and access profiles.
  notes: 'Baseline Slide 2 defines the three core pillars: Identity, Account, and Access. Identities represent the human or
    service entity, accounts represent presence on individual systems, and access defines effective operational rights.'
  additions:
  - Exist
- slide_number: 3
  layout: Title and Content
  role: architecture
  baseline_slides:
  - 3
  redrawn_media:
  - image21.png
  - image23.png
  - image25.png
  badge: Entity Relationships
  title: Identity, Account & Access Architecture
  subtitle: Relational mapping connecting central identities to target accounts and granular access
  content:
    diagram:
      kind: svg
      src: assets/diagram_identity_model_components.svg
      title: Identity Model Components Architecture
    body: Central identities govern accounts across target sources. Users never log into target systems as identities; identities
      govern accounts which hold native access permissions.
  notes: 'Baseline Slide 3 visualizes the foundational relationship: an identity links to 0..N target accounts, which hold
    native permissions and entitlements. Roles and access profiles govern how access is packaged and assigned.'
  additions:
  - Architecture
  - Relationships
