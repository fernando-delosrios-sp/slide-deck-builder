<svg viewBox="0 0 960 460" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bb-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="bb-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .bb-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .bb-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94A3B8; }
    .bb-badge { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.5px; }
    .bb-group-label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #64748B; letter-spacing: 1px; }
    .bb-flow-line { fill: none; stroke: #38BDF8; stroke-width: 2; }
    .bb-dash-line { fill: none; stroke: #64748B; stroke-width: 1.8; stroke-dasharray: 4 4; }
  </style>

  <!-- Group 1: Authoritative Ingestion Layer -->
  <rect x="25" y="30" width="270" height="400" rx="14" fill="rgba(15, 23, 42, 0.4)" stroke="#334155" stroke-width="1.2" stroke-dasharray="6 4" />
  <text x="45" y="60" class="bb-group-label">AUTHORITATIVE INGESTION</text>

  <!-- Auth Source -->
  <g transform="translate(45, 80)" filter="url(#bb-shadow)">
    <rect width="230" height="90" rx="10" fill="url(#bb-card-bg)" stroke="#38BDF8" stroke-width="1.5" />
    <text x="14" y="26" class="bb-badge" fill="#38BDF8">SYSTEM OF RECORD</text>
    <text x="14" y="50" class="bb-title">Authoritative Source</text>
    <text x="14" y="70" class="bb-sub">Workday, SAP HR, SuccessFactors</text>
  </g>

  <!-- Arrow down to Identity Profile -->
  <path d="M 160 170 L 160 215" class="bb-flow-line" />
  <text x="175" y="196" style="font-family: system-ui; font-size: 10px; fill: #F43F5E; font-weight: 700;">1 : 1</text>

  <!-- Identity Profile -->
  <g transform="translate(45, 220)" filter="url(#bb-shadow)">
    <rect width="230" height="90" rx="10" fill="url(#bb-card-bg)" stroke="#818CF8" stroke-width="1.5" />
    <text x="14" y="26" class="bb-badge" fill="#818CF8">GOVERNANCE POLICY</text>
    <text x="14" y="50" class="bb-title">Identity Profile</text>
    <text x="14" y="70" class="bb-sub">Attribute Mappings &amp; Lifecycle</text>
  </g>

  <!-- Arrow down to Accounts (Auth) -->
  <path d="M 160 310 L 160 345" class="bb-flow-line" />
  <text x="175" y="332" style="font-family: system-ui; font-size: 10px; fill: #F43F5E; font-weight: 700;">1 : N</text>

  <g transform="translate(45, 345)" filter="url(#bb-shadow)">
    <rect width="230" height="65" rx="8" fill="url(#bb-card-bg)" stroke="#34D399" stroke-width="1" />
    <text x="14" y="26" class="bb-badge" fill="#34D399">AGGREGATED DATA</text>
    <text x="14" y="48" class="bb-title">Authoritative Accounts</text>
  </g>

  <!-- Cross-Layer Arrow: Identity Profile to Central Identity -->
  <path d="M 275 265 L 345 265" class="bb-flow-line" />
  <text x="310" y="255" style="font-family: system-ui; font-size: 10px; fill: #F43F5E; font-weight: 700;">1 : N</text>

  <!-- Group 2: Access & Governance Layer -->
  <rect x="325" y="30" width="310" height="400" rx="14" fill="rgba(15, 23, 42, 0.4)" stroke="#334155" stroke-width="1.2" stroke-dasharray="6 4" />
  <text x="345" y="60" class="bb-group-label">ACCESS GOVERNANCE</text>

  <!-- Role -->
  <g transform="translate(345, 80)" filter="url(#bb-shadow)">
    <rect width="270" height="90" rx="10" fill="url(#bb-card-bg)" stroke="#818CF8" stroke-width="1.5" />
    <text x="14" y="26" class="bb-badge" fill="#818CF8">BUSINESS ROLES</text>
    <text x="14" y="50" class="bb-title">Roles (Org / Tech)</text>
    <text x="14" y="70" class="bb-sub">Cross-Application Bundles</text>
  </g>

  <!-- Arrow between Role and Identity -->
  <path d="M 480 170 L 480 220" class="bb-flow-line" />
  <text x="495" y="198" style="font-family: system-ui; font-size: 10px; fill: #F43F5E; font-weight: 700;">0 .. N</text>

  <!-- Central Identity -->
  <g transform="translate(345, 220)" filter="url(#bb-shadow)">
    <rect width="270" height="90" rx="10" fill="url(#bb-card-bg)" stroke="#38BDF8" stroke-width="2" />
    <text x="14" y="26" class="bb-badge" fill="#38BDF8">CORE PERSONA</text>
    <text x="14" y="50" class="bb-title">Central Identity</text>
    <text x="14" y="70" class="bb-sub">Master Record &amp; Correlator</text>
  </g>

  <!-- Group 3: Target Systems & Permissions Layer -->
  <rect x="665" y="30" width="270" height="400" rx="14" fill="rgba(15, 23, 42, 0.4)" stroke="#334155" stroke-width="1.2" stroke-dasharray="6 4" />
  <text x="685" y="60" class="bb-group-label">TARGET APPLICATIONS</text>

  <!-- Access Profile -->
  <g transform="translate(685, 80)" filter="url(#bb-shadow)">
    <rect width="230" height="85" rx="10" fill="url(#bb-card-bg)" stroke="#A855F7" stroke-width="1.5" />
    <text x="14" y="24" class="bb-badge" fill="#A855F7">SINGLE SOURCE</text>
    <text x="14" y="48" class="bb-title">Access Profile</text>
    <text x="14" y="68" class="bb-sub">1:1 Target System Bound</text>
  </g>

  <!-- Arrow from Role to Access Profile -->
  <path d="M 615 125 L 685 125" class="bb-flow-line" />
  <text x="650" y="118" style="font-family: system-ui; font-size: 10px; fill: #F43F5E; font-weight: 700;">1 : N</text>

  <!-- Entitlements -->
  <g transform="translate(685, 195)" filter="url(#bb-shadow)">
    <rect width="230" height="80" rx="10" fill="url(#bb-card-bg)" stroke="#EC4899" stroke-width="1.5" />
    <text x="14" y="24" class="bb-badge" fill="#EC4899">FINE-GRAINED</text>
    <text x="14" y="46" class="bb-title">Entitlements</text>
    <text x="14" y="66" class="bb-sub">Groups, Rights &amp; Permissions</text>
  </g>

  <!-- Arrow AP to Entitlements -->
  <path d="M 800 165 L 800 195" class="bb-flow-line" />
  <text x="815" y="184" style="font-family: system-ui; font-size: 10px; fill: #F43F5E; font-weight: 700;">1 : N</text>

  <!-- Target Accounts & Sources -->
  <g transform="translate(685, 305)" filter="url(#bb-shadow)">
    <rect width="230" height="105" rx="10" fill="url(#bb-card-bg)" stroke="#10B981" stroke-width="1.5" />
    <text x="14" y="24" class="bb-badge" fill="#10B981">TARGET SYSTEMS</text>
    <text x="14" y="48" class="bb-title">Target Accounts &amp; Sources</text>
    <text x="14" y="68" class="bb-sub">AD, SAP, Salesforce, AWS</text>
    <text x="14" y="88" class="bb-sub">• Account holds 0..N Entitlements</text>
  </g>

  <!-- Correlation from Central Identity to Target Accounts -->
  <path d="M 615 265 L 650 265 L 650 357 L 685 357" class="bb-dash-line" />
  <text x="635" y="305" style="font-family: system-ui; font-size: 10px; fill: #94A3B8; text-anchor: middle;">Correlates</text>
</svg>
