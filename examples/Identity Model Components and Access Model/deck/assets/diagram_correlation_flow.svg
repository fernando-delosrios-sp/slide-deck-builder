<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B111E" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#011C48" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="matchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0033A1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0B111E" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#011C48" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0033A1" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glowAqua2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrAqua" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#54C0E8"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#93D500"/>
    </marker>
    <marker id="arrPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D60EB5"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="540" rx="16" fill="#070C16" stroke="#415364" stroke-width="1.5"/>

  <!-- Step 1: Target Applications Grid (Left) -->
  <g transform="translate(35, 120)">
    <rect width="210" height="300" rx="14" fill="url(#cardGrad2)" stroke="#415364" stroke-width="1.5"/>
    <rect x="16" y="16" width="110" height="24" rx="12" fill="#54C0E8" fill-opacity="0.15" stroke="#54C0E8" stroke-width="1"/>
    <text x="71" y="32" fill="#54C0E8" font-family="Poppins, sans-serif" font-size="11" font-weight="600" text-anchor="middle">STEP 01</text>
    <text x="16" y="66" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="17" font-weight="700">Target Sources</text>
    <text x="16" y="88" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="12">Scheduled Ingestion</text>

    <!-- App Chips -->
    <g transform="translate(16, 105)">
      <rect width="178" height="36" rx="8" fill="#011C48" stroke="#415364" stroke-width="1"/>
      <text x="12" y="23" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="12" font-weight="500">Active Directory / Entra</text>
    </g>
    <g transform="translate(16, 150)">
      <rect width="178" height="36" rx="8" fill="#011C48" stroke="#415364" stroke-width="1"/>
      <text x="12" y="23" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="12" font-weight="500">AWS / Cloud Accounts</text>
    </g>
    <g transform="translate(16, 195)">
      <rect width="178" height="36" rx="8" fill="#011C48" stroke="#415364" stroke-width="1"/>
      <text x="12" y="23" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="12" font-weight="500">Salesforce CRM</text>
    </g>
    <g transform="translate(16, 240)">
      <rect width="178" height="36" rx="8" fill="#011C48" stroke="#415364" stroke-width="1"/>
      <text x="12" y="23" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="12" font-weight="500">SAP ERP / Legacy On-Prem</text>
    </g>
  </g>

  <!-- Arrow to Step 2 -->
  <path d="M 245 270 L 295 270" stroke="#54C0E8" stroke-width="2.5" marker-end="url(#arrAqua)" fill="none"/>

  <!-- Step 2: Correlation Engine Evaluation -->
  <g transform="translate(305, 120)">
    <rect width="260" height="300" rx="14" fill="url(#cardGrad2)" stroke="#54C0E8" stroke-width="2" filter="url(#glowAqua2)"/>
    <rect x="16" y="16" width="110" height="24" rx="12" fill="#54C0E8" fill-opacity="0.2" stroke="#54C0E8" stroke-width="1"/>
    <text x="71" y="32" fill="#54C0E8" font-family="Poppins, sans-serif" font-size="11" font-weight="600" text-anchor="middle">STEP 02: ENGINE</text>
    <text x="16" y="66" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="17" font-weight="700">Correlation Logic</text>
    <text x="16" y="88" fill="#54C0E8" font-family="Poppins, sans-serif" font-size="12" font-weight="500">Deterministic Matching Rules</text>

    <!-- Rule Criteria Box -->
    <rect x="16" y="105" width="228" height="175" rx="10" fill="#070C16" stroke="#415364" stroke-width="1"/>
    <text x="26" y="130" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="11" font-weight="600">EVALUATION PRECEDENCE:</text>
    <text x="26" y="154" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="12">1. Email == workEmail</text>
    <text x="26" y="178" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="12">2. employeeNumber == empId</text>
    <text x="26" y="202" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="12">3. sAMAccountName == uid</text>
    <text x="26" y="226" fill="#54C0E8" font-family="Poppins, sans-serif" font-size="11">4. Custom Transform Script</text>
    <rect x="26" y="244" width="208" height="24" rx="6" fill="#0033A1" fill-opacity="0.4"/>
    <text x="130" y="260" fill="#93D500" font-family="Poppins, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Deterministic 1:1 Identity Matching</text>
  </g>

  <!-- Connectors from Engine to Outcomes -->
  <!-- Top Branch: Match Success -->
  <path d="M 565 220 Q 610 220 635 170 L 655 170" stroke="#93D500" stroke-width="2.5" marker-end="url(#arrGreen)" fill="none"/>
  <rect x="585" y="165" width="55" height="20" rx="4" fill="#070C16" stroke="#93D500" stroke-width="1"/>
  <text x="612" y="179" fill="#93D500" font-family="Poppins, sans-serif" font-size="10" font-weight="600" text-anchor="middle">MATCH</text>

  <!-- Bottom Branch: Uncorrelated / Orphan -->
  <path d="M 565 320 Q 610 320 635 370 L 655 370" stroke="#D60EB5" stroke-width="2.5" marker-end="url(#arrPink)" fill="none"/>
  <rect x="575" y="340" width="75" height="20" rx="4" fill="#070C16" stroke="#D60EB5" stroke-width="1"/>
  <text x="612" y="354" fill="#D60EB5" font-family="Poppins, sans-serif" font-size="10" font-weight="600" text-anchor="middle">NO MATCH</text>

  <!-- Outcome 1: Correlated Identity Ownership (Top Right) -->
  <g transform="translate(665, 80)">
    <rect width="260" height="175" rx="14" fill="url(#matchGrad)" stroke="#93D500" stroke-width="2"/>
    <rect x="16" y="16" width="130" height="24" rx="12" fill="#93D500" fill-opacity="0.2" stroke="#93D500" stroke-width="1"/>
    <text x="81" y="32" fill="#93D500" font-family="Poppins, sans-serif" font-size="11" font-weight="600" text-anchor="middle">OWNERSHIP LINKED</text>
    <text x="16" y="66" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="17" font-weight="700">Central Master Identity</text>
    <text x="16" y="88" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="12">• Direct account attribution</text>
    <text x="16" y="108" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="12">• Entitlements visible in catalog</text>
    <text x="16" y="128" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="12">• Access review &amp; certification active</text>
    <text x="16" y="148" fill="#93D500" font-family="Poppins, sans-serif" font-size="11" font-weight="600">✓ Governed Lifecycle Alignment</text>
  </g>

  <!-- Outcome 2: Uncorrelated Accounts Queue (Bottom Right) -->
  <g transform="translate(665, 280)">
    <rect width="260" height="175" rx="14" fill="url(#cardGrad2)" stroke="#D60EB5" stroke-width="2" filter="url(#glowPink)"/>
    <rect x="16" y="16" width="140" height="24" rx="12" fill="#D60EB5" fill-opacity="0.2" stroke="#D60EB5" stroke-width="1"/>
    <text x="86" y="32" fill="#D60EB5" font-family="Poppins, sans-serif" font-size="11" font-weight="600" text-anchor="middle">REMEDIATION QUEUE</text>
    <text x="16" y="66" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="17" font-weight="700">Uncorrelated Accounts</text>
    <text x="16" y="88" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="12">• Flagged orphan / service account</text>
    <text x="16" y="108" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="12">• Admin remediation workflow</text>
    <text x="16" y="128" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="12">• Manual correlation or rule refine</text>
    <text x="16" y="148" fill="#D60EB5" font-family="Poppins, sans-serif" font-size="11" font-weight="600">⚠ Zero Unaccounted Access</text>
  </g>

  <!-- Legend Header Tag -->
  <g transform="translate(50, 485)">
    <text x="0" y="20" fill="#54C0E8" font-family="Poppins, sans-serif" font-size="12" font-weight="600">ARCHITECTURAL RULE:</text>
    <text x="160" y="20" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="12">Target sources do NOT create identities — they only attach correlated accounts to authoritative identities.</text>
  </g>
</svg>
