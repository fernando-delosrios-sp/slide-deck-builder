<svg viewBox="0 0 940 380" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lc-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="lc-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="lc-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38BDF8" />
    </marker>
    <marker id="lc-purple-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#818CF8" />
    </marker>
    <marker id="lc-green-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34D399" />
    </marker>
    <marker id="lc-red-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444" />
    </marker>
    <marker id="lc-amber-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B" />
    </marker>
  </defs>

  <style>
    .lc-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .lc-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94A3B8; }
    .lc-badge { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.5px; }
  </style>

  <!-- State 1: Pre-Hire -->
  <g transform="translate(30, 40)" filter="url(#lc-shadow)">
    <rect width="180" height="110" rx="10" fill="url(#lc-card-bg)" stroke="#64748B" stroke-width="1.5" />
    <text x="14" y="26" class="lc-badge" fill="#94A3B8">STAGED INGESTION</text>
    <text x="14" y="52" class="lc-title">Pre-Hire</text>
    <text x="14" y="74" class="lc-sub">• Pending start date</text>
    <text x="14" y="94" class="lc-sub">• Accounts staged in AD</text>
  </g>

  <!-- Transition: Pre-Hire to Active -->
  <path d="M 210 95 L 285 95" fill="none" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#lc-arrow)" />
  <rect x="216" y="73" width="60" height="16" rx="3" fill="#0B111E" />
  <text x="246" y="85" style="font-family: system-ui; font-size: 9px; fill: #38BDF8; font-weight: 600; text-anchor: middle;">Start Date</text>

  <!-- State 2: Active -->
  <g transform="translate(295, 40)" filter="url(#lc-shadow)">
    <rect width="210" height="110" rx="10" fill="url(#lc-card-bg)" stroke="#34D399" stroke-width="2" />
    <text x="14" y="26" class="lc-badge" fill="#34D399">OPERATIONAL ACCESS</text>
    <text x="14" y="52" class="lc-title">Active</text>
    <text x="14" y="74" class="lc-sub">• Birthright Access Profiles</text>
    <text x="14" y="94" class="lc-sub">• Business Roles Assigned</text>
  </g>

  <!-- Transition: Active to Mover -->
  <path d="M 505 95 L 575 95" fill="none" stroke="#818CF8" stroke-width="2.5" marker-end="url(#lc-purple-arrow)" />
  <rect x="506" y="73" width="70" height="16" rx="3" fill="#0B111E" />
  <text x="541" y="85" style="font-family: system-ui; font-size: 9px; fill: #818CF8; font-weight: 600; text-anchor: middle;">Dept / Title</text>

  <!-- State 3: Mover -->
  <g transform="translate(585, 40)" filter="url(#lc-shadow)">
    <rect width="200" height="110" rx="10" fill="url(#lc-card-bg)" stroke="#818CF8" stroke-width="1.5" />
    <text x="14" y="26" class="lc-badge" fill="#818CF8">ROLE RECALCULATION</text>
    <text x="14" y="52" class="lc-title">Mover</text>
    <text x="14" y="74" class="lc-sub">• Revokes obsolete access</text>
    <text x="14" y="94" class="lc-sub">• Provisions new roles</text>
  </g>

  <!-- Return arrow Mover to Active -->
  <path d="M 685 150 L 685 180 L 400 180 L 400 155" fill="none" stroke="#818CF8" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#lc-purple-arrow)" />
  <rect x="500" y="172" width="80" height="16" rx="3" fill="#0B111E" />
  <text x="540" y="184" style="font-family: system-ui; font-size: 9px; fill: #818CF8; text-anchor: middle;">Rejoins Active</text>

  <!-- Transition: Active down to Suspended -->
  <path d="M 350 150 L 350 245" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#lc-amber-arrow)" />
  <rect x="305" y="190" width="90" height="16" rx="3" fill="#0B111E" />
  <text x="350" y="202" style="font-family: system-ui; font-size: 9px; fill: #F59E0B; font-weight: 600; text-anchor: middle;">Leave of Absence</text>

  <!-- State 4: Suspended -->
  <g transform="translate(250, 255)" filter="url(#lc-shadow)">
    <rect width="200" height="95" rx="10" fill="url(#lc-card-bg)" stroke="#F59E0B" stroke-width="1.5" />
    <text x="14" y="26" class="lc-badge" fill="#F59E0B">TEMPORARY PAUSE</text>
    <text x="14" y="50" class="lc-title">Suspended</text>
    <text x="14" y="72" class="lc-sub">• Access disabled across AD &amp; SaaS</text>
  </g>

  <!-- Return arrow Suspended to Active -->
  <path d="M 450 295 L 475 295 L 475 155" fill="none" stroke="#34D399" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#lc-green-arrow)" />
  <rect x="445" y="220" width="75" height="16" rx="3" fill="#0B111E" />
  <text x="482" y="232" style="font-family: system-ui; font-size: 9px; fill: #34D399; text-anchor: middle;">Return to Work</text>

  <!-- Transition: Active to Terminated -->
  <path d="M 430 150 L 430 215 L 685 215 L 685 245" fill="none" stroke="#EF4444" stroke-width="2.5" marker-end="url(#lc-red-arrow)" />
  <rect x="525" y="207" width="90" height="16" rx="3" fill="#0B111E" />
  <text x="570" y="219" style="font-family: system-ui; font-size: 9px; fill: #EF4444; font-weight: 600; text-anchor: middle;">Departure Event</text>

  <!-- State 5: Terminated -->
  <g transform="translate(585, 255)" filter="url(#lc-shadow)">
    <rect width="240" height="95" rx="10" fill="url(#lc-card-bg)" stroke="#EF4444" stroke-width="2" />
    <text x="14" y="26" class="lc-badge" fill="#EF4444">FULL REVOCATION</text>
    <text x="14" y="50" class="lc-title">Terminated</text>
    <text x="14" y="72" class="lc-sub">• All roles &amp; profiles revoked</text>
    <text x="14" y="88" class="lc-sub">• Zero-day target account deletion</text>
  </g>
</svg>
