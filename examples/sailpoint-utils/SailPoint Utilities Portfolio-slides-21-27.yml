title: "SailPoint Utilities Portfolio"
goal: "Present the reusable patterns in the sailpoint-utils repository, with the PowerShell Rule Template as the foundation of a growing rule catalogue. Draw detail from the repository sources."
slide_count: 8
options:
  language: "en"
  audience: "SailPoint colleagues"
  tone: "Engaging and professional"
slides:
  - slide_number: 21
    layout: "Two Content"
    role: "solution_intro"
    title: "Curated Transforms Catalog"
    subtitle: "A starting library that sets best practices"
    content:
      regions:
        - id: "left"
          kind: "text"
          bullets:
            - "Intention: seed a shared catalogue, not a finished set of every computation."
            - "Bar: solid transforms that teams copy instead of rewriting."
            - "Reuse: the same dates, history, lifecycle, and manager logic in every tenant."
      diagram:
        kind: "cards"
        elements:
          - "Dates"
          - "Attribute History"
          - "Lifecycle State"
          - "Is Manager"
        emphasis: "Start here, then add transforms that meet the same bar."
    notes: "ISC/Transforms on GitHub is the seed: https://github.com/fernando-delosrios-sp/sailpoint-utils/tree/main/ISC/Transforms"

  - slide_number: 22
    layout: "Title and Content"
    role: "solution_intro"
    title: "SaaS Custom Operations"
    subtitle: "A workflow runtime and a library of use cases"
    content:
      bullets:
        - "Challenge: Workflows need custom ISC logic that native steps do not provide."
        - "Solution: A custom-operations framework plus ready commands and workflow templates."
        - "Value: Deploy once, reuse proven operations, and add new ones the same way."

  - slide_number: 23
    layout: "Two Content"
    role: "deep_dive"
    title: "Framework Plus Catalogue"
    subtitle: "Invoke, persist, then read results"
    content:
      regions:
        - id: "left"
          kind: "text"
          bullets:
            - "Workflows invoke a typed handler that calls back into ISC APIs."
            - "Results persist to an auto-provisioned source for later workflow steps."
            - "Shipped operations cover SoD remediation, catalogue checks, and group emails."
      diagram:
        kind: "flow"
        elements:
          - "Workflow Invoke"
          - "Handler & ISC APIs"
          - "Persist Result"
          - "Read in Workflow"
        emphasis: "A runtime for workflow logic, not an aggregation source."

  - slide_number: 24
    layout: "Title and Content"
    role: "solution_intro"
    title: "OrangeHRM Consolidated Employee Page"
    subtitle: "Type the whole record once"
    content:
      bullets:
        - "Challenge: Onboarding walks separate tabs for job, contact, manager, and login."
        - "Solution: One employee page collects the whole record and saves it together."
        - "Value: Quicker, more consistent entry, and ISC syncs on the same save."

  - slide_number: 25
    layout: "Two Content"
    role: "deep_dive"
    title: "One Form, One Save"
    subtitle: "Identity, job, contact, manager, and login together"
    content:
      regions:
        - id: "left"
          kind: "text"
          bullets:
            - "Name, ID, job title, department, location, and status sit on one page."
            - "So do phones, emails, contract dates, photo, and an optional login."
            - "One save writes employee, contract, direct manager, and user account."
            - "Later job, contact, report-to, terminate, and activate edits sync the same way."
      diagram:
        kind: "flow"
        elements:
          - "Consolidated Employee Page"
          - "Single Save"
          - "Employee, Contract, Manager, Login"
          - "Aggregation Request to ISC"
        emphasis: "One page replaces the tab-by-tab walk."

  - slide_number: 26
    layout: "Title and Content"
    role: "solution_intro"
    title: "ISC Config Backup"
    subtitle: "Daily backups and assisted restore from GitHub"
    content:
      bullets:
        - "Challenge: Tenant configuration needs a safety net and a history the team can browse."
        - "Solution: Register ISC tenants in isc-config-backup; GitHub Actions run daily backups and help restore."
        - "Value: Manage it from the GitHub UI—an easy safety net and a tenant config archive over time."

  - slide_number: 27
    layout: "Section Header"
    role: "transition"
    title: "Deployment & Strategy"
    subtitle: "Using the catalogue"
    content:
      body: "Clone, configure, and extend these patterns safely."

  - slide_number: 28
    layout: "Title Slide"
    role: "closing"
    title: "Deploy and Accelerate"
    subtitle: "fernando-delosrios-sp/sailpoint-utils on GitHub"
    content:
      body: "Each utility ships its own README. Clone, configure, and contribute your own patterns."
