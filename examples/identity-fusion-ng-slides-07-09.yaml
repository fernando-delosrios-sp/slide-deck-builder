title: "Identity Fusion NG"
goal: "Give newcomers the value and mental model of Identity Fusion NG: why it exists, how Map-Define-Match works, who participates, and how to run it."
options:
  language: "en"
  audience: "New to the product; an SME presents from identity-fusion-ng-speaker-notes.md"
  tone: "Technical and educational"
  length: "long"
slides:
  - slide_number: 7
    layout: "Title and Content"
    role: "deep_dive"
    title: "What does Define compute, and when?"
    subtitle: "Normal attributes before scoring, unique values after"
    content:
      bullets:
        - "Velocity expressions read mapped values, identity fields, source snapshots and prior state."
        - "Normal definitions run before Match, so normalised names and dates improve scoring."
        - "Unique definitions run after Match: usernames, employee numbers, counters and UUIDs."
        - "Collisions retry with a disambiguating counter up to the configured maximum attempts."
      diagram:
        kind: "timeline"
        elements:
          - "Map"
          - "Normal Define: normalised names and dates"
          - "Match: scoring"
          - "Unique Define: usernames, employee numbers, counters, UUIDs"
        connections:
          - "Map -> Normal Define -> Match -> Unique Define"
        emphasis: "Unique values are minted only after Match decides."

  - slide_number: 8
    layout: "Title and Content"
    role: "deep_dive"
    title: "What can happen to an account in Match?"
    subtitle: "Four exits, decided against the baseline"
    content:
      bullets:
        - "Only uncorrelated managed accounts are scored, against the baseline of known Fusion identities."
        - "Automatic merge when the combined score clears the configured auto-merge threshold."
        - "Review form when the score clears the review floor but not the auto-merge threshold."
        - "Non-match exits by source type: create an identity or drop the account."
      diagram:
        kind: "funnel"
        elements:
          - "Uncorrelated managed accounts"
          - "Above auto-merge threshold: automatic merge"
          - "Between review floor and auto-merge threshold: review form"
          - "Below review floor: non-match"
          - "Non-match by source type: create identity or drop account"
        connections:
          - "Uncorrelated managed accounts -> scored against baseline"
          - "score -> automatic merge, review form or non-match"
        emphasis: "Two thresholds split the score range into three outcomes."

  - slide_number: 9
    layout: "Title and Content"
    role: "deep_dive"
    title: "How is a match score built?"
    subtitle: "Weighted similarity with mandatory rules as vetoes"
    content:
      bullets:
        - "Each rule compares one attribute with a chosen algorithm and a threshold."
        - "The threshold is also the rule's weight in the combined score."
        - "A failed mandatory rule rejects the candidate whatever the combined score says."
        - "Skip if missing keeps empty attributes from dragging a score down."
      diagram:
        kind: "matrix"
        elements:
          - "Header: attribute | algorithm or flag | target identity value | candidate account value | similarity"
          - "Record: given name | Enhanced Name Matcher | Jane | Jayne | high, weighted"
          - "Record: employee ID | Binary | E-1042 | E-1042 | exact"
          - "Record: department | skip if missing | Engineering | (empty) | omitted"
          - "Record: clearance status | mandatory rule | Secret | Confidential | fail, veto"
          - "Record: combined score | | | | above review floor, still rejected"
        emphasis: "A failed mandatory rule rejects a candidate that clears the combined score."
