<svg viewBox="0 0 920 420" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ingest-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0033A1" />
      <stop offset="100%" stop-color="#54C0E8" />
    </linearGradient>
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#54C0E8" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B" />
    </marker>
  </defs>

  <style>
    .title-text { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .sub-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #94A3B8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; fill: #54C0E8; letter-spacing: 0.5px; }
    .link-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; fill: #54C0E8; text-anchor: middle; }
    .target-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #E2E8F0; }
  </style>

  <!-- Stage 1: Authoritative Source -->
  <g transform="translate(30, 130)" filter="url(#drop-shadow)">
    <rect width="210" height="150" rx="12" fill="url(#ingest-card-bg)" stroke="#38BDF8" stroke-width="1.5" />
    <rect x="16" y="16" width="90" height="20" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
    <text x="61" y="30" class="badge-text" text-anchor="middle">SYSTEM OF RECORD</text>
    <text x="16" y="66" class="title-text">Authoritative Source</text>
    <text x="16" y="88" class="sub-text">Workday / SAP HR</text>
    <text x="16" y="112" class="sub-text">• Personnel Attributes</text>
    <text x="16" y="132" class="sub-text">• Employment Status</text>
  </g>

  <!-- Path 1 to 2 -->
  <path d="M 240 205 L 315 205" fill="none" stroke="#54C0E8" stroke-width="2.5" marker-end="url(#arrow-cyan)" />
  <rect x="238" y="180" width="76" height="18" rx="3" fill="#0B111E" />
  <text x="276" y="193" class="link-label">Aggregate</text>

  <!-- Stage 2: Identity Profile -->
  <g transform="translate(325, 130)" filter="url(#drop-shadow)">
    <rect width="220" height="150" rx="12" fill="url(#ingest-card-bg)" stroke="#818CF8" stroke-width="1.5" />
    <rect x="16" y="16" width="115" height="20" rx="4" fill="rgba(129, 140, 248, 0.15)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1"/>
    <text x="73" y="30" class="badge-text" fill="#818CF8" text-anchor="middle">GOVERNANCE TEMPLATE</text>
    <text x="16" y="66" class="title-text">Identity Profile</text>
    <text x="16" y="88" class="sub-text">Employees / Contractors</text>
    <text x="16" y="112" class="sub-text">• 1:1 Source Binding</text>
    <text x="16" y="132" class="sub-text">• Attribute Transforms</text>
  </g>

  <!-- Path 2 to 3 -->
  <path d="M 545 205 L 615 205" fill="none" stroke="#54C0E8" stroke-width="2.5" marker-end="url(#arrow-cyan)" />
  <rect x="548" y="180" width="66" height="18" rx="3" fill="#0B111E" />
  <text x="581" y="193" class="link-label">Generates</text>

  <!-- Stage 3: Central Identity -->
  <g transform="translate(625, 130)" filter="url(#drop-shadow)">
    <rect width="255" height="150" rx="12" fill="url(#ingest-card-bg)" stroke="#34D399" stroke-width="1.5" />
    <rect x="16" y="16" width="105" height="20" rx="4" fill="rgba(52, 211, 153, 0.15)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1"/>
    <text x="68" y="30" class="badge-text" fill="#34D399" text-anchor="middle">MASTER IDENTITY</text>
    <text x="16" y="66" class="title-text">Central Identity</text>
    <text x="16" y="88" class="sub-text">Unified Digital Persona</text>
    <text x="16" y="112" class="sub-text">• Correlates Target Accounts</text>
    <text x="16" y="132" class="sub-text">• Manages Lifecycle States</text>
  </g>

  <!-- Downstream Target Connection Lines (dashed) -->
  <path d="M 752 280 L 752 335" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrow-muted)" />
  <rect x="715" y="295" width="75" height="16" rx="3" fill="#0B111E" />
  <text x="752" y="307" style="font-family: system-ui; font-size: 10px; fill: #94A3B8; text-anchor: middle;">Correlates</text>

  <!-- Downstream Target System Cards -->
  <g transform="translate(560, 345)" filter="url(#drop-shadow)">
    <rect width="170" height="52" rx="8" fill="#0B132B" stroke="#475569" stroke-width="1" />
    <text x="16" y="24" class="target-title">Active Directory</text>
    <text x="16" y="42" class="sub-text">Corporate User Account</text>
  </g>

  <g transform="translate(745, 345)" filter="url(#drop-shadow)">
    <rect width="155" height="52" rx="8" fill="#0B132B" stroke="#475569" stroke-width="1" />
    <text x="16" y="24" class="target-title">AWS &amp; Salesforce</text>
    <text x="16" y="42" class="sub-text">Target Cloud Logins</text>
  </g>
</svg>
