<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <marker id="arr17" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#54C0E8"/>
    </marker>
  </defs>

  <rect width="1000" height="500" rx="16" fill="#070C16" stroke="#415364" stroke-width="1.5"/>

  <!-- Left: Source System Groups Data -->
  <g transform="translate(50, 50)">
    <rect width="280" height="380" rx="12" fill="#0B111E" stroke="#415364" stroke-width="1.5"/>
    <text x="25" y="35" fill="#54C0E8" font-family="Poppins, sans-serif" font-size="11" font-weight="700">SOURCE SYSTEM DATA</text>
    <text x="25" y="60" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="16" font-weight="700">Native Groups</text>
    
    <!-- Table Mockup -->
    <rect x="20" y="85" width="240" height="40" rx="6" fill="#0033A1" fill-opacity="0.4"/>
    <text x="30" y="110" fill="#54C0E8" font-family="Poppins, sans-serif" font-size="11" font-weight="700">id</text>
    <text x="80" y="110" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="11">Group1</text>
    
    <rect x="20" y="135" width="240" height="50" rx="6" fill="#070C16" stroke="#415364" stroke-width="1"/>
    <text x="30" y="155" fill="#54C0E8" font-family="Poppins, sans-serif" font-size="10" font-weight="700">description</text>
    <text x="30" y="172" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="10">description for field ops</text>

    <rect x="20" y="195" width="240" height="40" rx="6" fill="#070C16" stroke="#415364" stroke-width="1"/>
    <text x="30" y="220" fill="#54C0E8" font-family="Poppins, sans-serif" font-size="11" font-weight="700">groupname</text>
    <text x="120" y="220" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="11">FieldOps</text>
    
    <text x="25" y="275" fill="#94A3B8" font-family="Poppins, sans-serif" font-size="11">• Aggregated via source connector</text>
    <text x="25" y="295" fill="#94A3B8" font-family="Poppins, sans-serif" font-size="11">• Stored as raw source attributes</text>
  </g>

  <path d="M 330 240 L 380 240" stroke="#54C0E8" stroke-width="2.5" marker-end="url(#arr17)"/>

  <!-- Middle: Schema Definition -->
  <g transform="translate(380, 50)">
    <rect width="250" height="380" rx="12" fill="#0B111E" stroke="#54C0E8" stroke-width="1.5"/>
    <text x="25" y="35" fill="#54C0E8" font-family="Poppins, sans-serif" font-size="11" font-weight="700">SOURCE SCHEMA</text>
    <text x="25" y="60" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="16" font-weight="700">Entitlement Schema</text>

    <rect x="20" y="90" width="210" height="45" rx="6" fill="#002266" fill-opacity="0.6"/>
    <text x="30" y="117" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="12" font-weight="600">id (Primary Key)</text>

    <rect x="20" y="145" width="210" height="45" rx="6" fill="#002266" fill-opacity="0.6"/>
    <text x="30" y="172" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="12" font-weight="600">description</text>

    <rect x="20" y="200" width="210" height="45" rx="6" fill="#002266" fill-opacity="0.6"/>
    <text x="30" y="227" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="12" font-weight="600">groupName</text>

    <text x="25" y="280" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="11">• Maps native permission object</text>
    <text x="25" y="300" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="11">• Defines attribute bindings</text>
  </g>

  <path d="M 630 240 L 680 240" stroke="#54C0E8" stroke-width="2.5" marker-end="url(#arr17)"/>

  <!-- Right: IdentityNow Entitlement Catalog -->
  <g transform="translate(680, 50)">
    <rect width="270" height="380" rx="12" fill="#0B111E" stroke="#93D500" stroke-width="1.5"/>
    <text x="25" y="35" fill="#93D500" font-family="Poppins, sans-serif" font-size="11" font-weight="700">IDENTITYNOW CATALOG</text>
    <text x="25" y="60" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="16" font-weight="700">Catalog Entitlement</text>

    <rect x="20" y="90" width="230" height="120" rx="8" fill="#070C16" stroke="#93D500" stroke-width="1"/>
    <text x="35" y="120" fill="#54C0E8" font-family="Poppins, sans-serif" font-size="11" font-weight="700">FIELD_OPERATIONS_ACCESS</text>
    <text x="35" y="145" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="11">Source: Active Directory</text>
    <text x="35" y="165" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="11">Type: Security Group</text>
    <text x="35" y="185" fill="#93D500" font-family="Poppins, sans-serif" font-size="11">Ready for Access Profile bundling</text>

    <text x="25" y="250" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="11">• Governed in Request Center</text>
    <text x="25" y="270" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="11">• Available for Access Profiles</text>
    <text x="25" y="290" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="11">• Tracked in Certifications</text>
  </g>
</svg>