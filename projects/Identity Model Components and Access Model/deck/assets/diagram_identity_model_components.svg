<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="idGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0033A1" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0B111E" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071CE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0B111E" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93D500" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0B111E" stop-opacity="0.95"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#54C0E8"/>
    </marker>
  </defs>

  <rect width="1000" height="520" rx="16" fill="#070C16" stroke="#415364" stroke-width="1.5"/>

  <!-- Identity Entity (Center Top) -->
  <g transform="translate(350, 40)">
    <rect width="300" height="130" rx="12" fill="url(#idGrad)" stroke="#54C0E8" stroke-width="2"/>
    <circle cx="45" cy="50" r="24" fill="#0033A1" stroke="#54C0E8" stroke-width="1.5"/>
    <text x="45" y="56" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="18" text-anchor="middle">👤</text>
    <text x="85" y="42" fill="#54C0E8" font-family="Poppins, sans-serif" font-size="11" font-weight="700">CORE ENTITY</text>
    <text x="85" y="65" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="18" font-weight="700">Identity</text>
    <text x="85" y="85" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="11">Central digital representation of</text>
    <text x="85" y="102" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="11">a person or service account</text>
  </g>

  <!-- Connectors -->
  <path d="M 450 170 L 250 240" stroke="#54C0E8" stroke-width="2" marker-end="url(#arr)" fill="none"/>
  <path d="M 550 170 L 750 240" stroke="#54C0E8" stroke-width="2" marker-end="url(#arr)" fill="none"/>
  <path d="M 380 320 L 620 320" stroke="#54C0E8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none"/>

  <!-- Account Entity (Bottom Left) -->
  <g transform="translate(100, 240)">
    <rect width="280" height="150" rx="12" fill="url(#accGrad)" stroke="#0071CE" stroke-width="1.5"/>
    <circle cx="45" cy="45" r="22" fill="#0B111E" stroke="#0071CE" stroke-width="1.5"/>
    <text x="45" y="52" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="16" text-anchor="middle">🔑</text>
    <text x="80" y="38" fill="#54C0E8" font-family="Poppins, sans-serif" font-size="11" font-weight="700">TARGET APPLICATION</text>
    <text x="80" y="60" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="18" font-weight="700">Account</text>
    <text x="25" y="95" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="11">• Representation on a source system</text>
    <text x="25" y="115" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="11">• Holds native credentials &amp; source ID</text>
    <text x="25" y="135" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="11">• 1 Identity : 0..N Accounts</text>
  </g>

  <!-- Access Entity (Bottom Right) -->
  <g transform="translate(620, 240)">
    <rect width="280" height="150" rx="12" fill="url(#accsGrad)" stroke="#93D500" stroke-width="1.5"/>
    <circle cx="45" cy="45" r="22" fill="#0B111E" stroke="#93D500" stroke-width="1.5"/>
    <text x="45" y="52" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="16" text-anchor="middle">🛡️</text>
    <text x="80" y="38" fill="#93D500" font-family="Poppins, sans-serif" font-size="11" font-weight="700">AUTHORIZATIONS &amp; ROLES</text>
    <text x="80" y="60" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="18" font-weight="700">Access</text>
    <text x="25" y="95" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="11">• Securities granting operational rights</text>
    <text x="25" y="115" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="11">• Entitlements, groups, permissions</text>
    <text x="25" y="135" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="11">• Bundled via Access Profiles &amp; Roles</text>
  </g>

  <!-- Bottom Relationship Banner -->
  <g transform="translate(100, 425)">
    <rect width="800" height="65" rx="10" fill="#0B111E" stroke="#415364" stroke-width="1"/>
    <text x="30" y="28" fill="#54C0E8" font-family="Poppins, sans-serif" font-size="11" font-weight="700">GOVERNANCE PRINCIPLE</text>
    <text x="30" y="48" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="13">Users never log into target systems as Identities; Identities govern Accounts which hold native Access.</text>
  </g>
</svg>