<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <marker id="arr30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#54C0E8"/>
    </marker>
  </defs>

  <rect width="1000" height="520" rx="16" fill="#070C16" stroke="#415364" stroke-width="1.5"/>

  <!-- Left: Identity Profile & Lifecycle States -->
  <g transform="translate(30, 40)">
    <rect width="300" height="440" rx="12" fill="#0B111E" stroke="#54C0E8" stroke-width="1.5"/>
    <text x="20" y="35" fill="#54C0E8" font-family="Poppins, sans-serif" font-size="11" font-weight="700">IDENTITY PROFILE TEMPLATE</text>
    <text x="20" y="55" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="15" font-weight="700">Lifecycle State Machine</text>
    
    <rect x="20" y="80" width="260" height="90" rx="8" fill="#0033A1" fill-opacity="0.4" stroke="#54C0E8" stroke-width="1"/>
    <text x="35" y="105" fill="#54C0E8" font-family="Poppins, sans-serif" font-size="11" font-weight="700">LIFECYCLE STATE 1: ACTIVE</text>
    <text x="35" y="125" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="13">Grants 1..N Roles &amp; APs</text>
    <text x="35" y="145" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="10">Automates birthright provisioning</text>

    <rect x="20" y="190" width="260" height="90" rx="8" fill="#070C16" stroke="#D60EB5" stroke-width="1"/>
    <text x="35" y="215" fill="#D60EB5" font-family="Poppins, sans-serif" font-size="11" font-weight="700">LIFECYCLE STATE 2: LEAVE</text>
    <text x="35" y="235" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="13">Suspends Accounts &amp; Roles</text>
    <text x="35" y="255" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="10">Revokes target access rights</text>

    <rect x="20" y="300" width="260" height="90" rx="8" fill="#070C16" stroke="#415364" stroke-width="1"/>
    <text x="35" y="325" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="11" font-weight="700">LIFECYCLE STATE 3: TERMINATED</text>
    <text x="35" y="345" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="13">Full Deprovisioning</text>
    <text x="35" y="365" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="10">Disables accounts, deletes credentials</text>
  </g>

  <!-- Connectors -->
  <path d="M 330 125 L 380 125" stroke="#54C0E8" stroke-width="2" marker-end="url(#arr30)"/>
  <path d="M 330 235 L 380 235" stroke="#D60EB5" stroke-width="2" marker-end="url(#arr30)"/>

  <!-- Middle: Roles & Access Profiles -->
  <g transform="translate(380, 40)">
    <rect width="280" height="440" rx="12" fill="#0B111E" stroke="#415364" stroke-width="1.5"/>
    <text x="20" y="35" fill="#93D500" font-family="Poppins, sans-serif" font-size="11" font-weight="700">ROLES &amp; ACCESS PROFILES</text>
    <text x="20" y="55" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="15" font-weight="700">Access Architecture</text>

    <rect x="20" y="80" width="240" height="85" rx="8" fill="#002266" fill-opacity="0.5" stroke="#93D500" stroke-width="1"/>
    <text x="35" y="105" fill="#93D500" font-family="Poppins, sans-serif" font-size="11" font-weight="700">ROLE R1 (MULTI-SOURCE)</text>
    <text x="35" y="125" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="13">Bundles AP1 + AP2</text>
    <text x="35" y="145" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="10">Driven by OrgUnit / Title</text>

    <path d="M 140 165 L 140 195" stroke="#54C0E8" stroke-width="2" marker-end="url(#arr30)"/>

    <rect x="20" y="195" width="240" height="85" rx="8" fill="#001633" fill-opacity="0.7" stroke="#54C0E8" stroke-width="1"/>
    <text x="35" y="220" fill="#54C0E8" font-family="Poppins, sans-serif" font-size="11" font-weight="700">ACCESS PROFILE AP1</text>
    <text x="35" y="240" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="13">Single-Source (AD)</text>
    <text x="35" y="260" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="10">Bundles E1 + E2</text>

    <rect x="20" y="300" width="240" height="85" rx="8" fill="#001633" fill-opacity="0.7" stroke="#415364" stroke-width="1"/>
    <text x="35" y="325" fill="#54C0E8" font-family="Poppins, sans-serif" font-size="11" font-weight="700">ACCESS PROFILE AP2</text>
    <text x="35" y="345" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="13">Single-Source (SAP)</text>
    <text x="35" y="365" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="10">Bundles E3 + E4</text>
  </g>

  <!-- Connectors -->
  <path d="M 660 235 L 710 235" stroke="#54C0E8" stroke-width="2" marker-end="url(#arr30)"/>

  <!-- Right: Connected Target Sources -->
  <g transform="translate(710, 40)">
    <rect width="260" height="440" rx="12" fill="#0B111E" stroke="#54C0E8" stroke-width="1.5"/>
    <text x="20" y="35" fill="#54C0E8" font-family="Poppins, sans-serif" font-size="11" font-weight="700">CONNECTED SYSTEMS</text>
    <text x="20" y="55" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="15" font-weight="700">Target Accounts</text>

    <rect x="20" y="80" width="220" height="150" rx="8" fill="#070C16" stroke="#54C0E8" stroke-width="1"/>
    <text x="35" y="110" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="13" font-weight="700">Active Directory</text>
    <text x="35" y="130" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="10">Account: jdoe</text>
    <text x="35" y="150" fill="#93D500" font-family="Poppins, sans-serif" font-size="10">Entitlement E1: Read</text>
    <text x="35" y="170" fill="#93D500" font-family="Poppins, sans-serif" font-size="10">Entitlement E2: Write</text>

    <rect x="20" y="250" width="220" height="150" rx="8" fill="#070C16" stroke="#415364" stroke-width="1"/>
    <text x="35" y="280" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="13" font-weight="700">SAP Financials</text>
    <text x="35" y="300" fill="#DAE1E9" font-family="Poppins, sans-serif" font-size="10">Account: JDOE_SAP</text>
    <text x="35" y="320" fill="#93D500" font-family="Poppins, sans-serif" font-size="10">Entitlement E3: Ledger</text>
    <text x="35" y="340" fill="#93D500" font-family="Poppins, sans-serif" font-size="10">Entitlement E4: Reports</text>
  </g>
</svg>