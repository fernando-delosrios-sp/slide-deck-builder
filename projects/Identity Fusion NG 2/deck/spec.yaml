title: "Identity Fusion NG"
goal: "Equip identity architects and engineers with the complete mental model, execution pipeline, and operational architectures of Identity Fusion NG for SailPoint Identity Security Cloud."
theme: "styles/kinetic-keynote-event-vision-design.md"
slide_count: 15
baseline: "../Identity Fusion NG - Introduction.pptx"

options:
  language: "en"
  audience: "Identity Architects & Engineers implementing SailPoint Identity Security Cloud (ISC)"
  tone: "Educational & Training — practical step-by-step mental model for enablement workshops"
  length: "long"

slides:
  - slide_number: 1
    layout: "Title Slide"
    role: "cover"
    badge: "Next-Gen Identity Fabric"
    title: "Identity Fusion NG"
    subtitle: "Map, Define, Match: messy multi-source accounts into one identity story"
    baseline_slides: [1]
    content:
      body: "Consolidate accounts, compute attributes, and match identities without relying on brittle exact-match correlation."
      image:
        src: "assets/image1.png"
        alt: "Identity Fusion NG Cover Illustration"
    notes: |
      Identity Fusion NG is an ISC connector. It consolidates managed-source accounts, computes attributes, and optionally matches identities so you are not limited to exact-match correlation.
      It supersedes the deprecated v1.x line. Point existing tenants at the migration guide.
      The slides are the mental model. These notes plus Home, Getting started, and the configuration guides are the manual.

  - slide_number: 2
    layout: "Comparison"
    role: "problem"
    badge: "Correlation Limits"
    title: "Why Identity Fusion NG?"
    subtitle: "The jobs that correlation rules alone cannot do cleanly"
    baseline_slides: [2]
    content:
      image:
        src: "assets/image2.png"
        alt: "Without Fusion vs With Fusion comparison diagram"
        caption: "Left: Two identities for one person | Right: One identity story via Continuous Purification Pipeline"
      comparison:
        left:
          badge: "Without Fusion"
          title: "Two Identities for One Person"
          bullets:
            - "One person in HR and AD becomes two identities when exact-match rules find nothing."
            - "Fragmented accounts create duplicate identity silos."
            - "Ambiguous candidates are unlinked or forced into manual reconciliations."
        right:
          badge: "With Fusion"
          title: "One Identity Story"
          bullets:
            - "Map aligns different source schemas and keeps multi-persona values side by side."
            - "Define mints unique identifiers and normalises values before anything is compared."
            - "Match finds near-duplicates and sends the grey zone to a reviewer, not to a guess."
    notes: |
      The failure mode is one person in HR and AD becoming two identities when correlation finds nothing.
      Map aligns schemas and can keep several values. Define mints identifiers and normalises names and dates before comparison. Match scores near-duplicates and sends the grey zone to a reviewer.
      Map and Define still pay off with Match off. Records and Orphan are teased here; the cheat sheet is slide 4.

  - slide_number: 3
    layout: "Title and Content"
    role: "architecture"
    badge: "Core Framework"
    title: "What is the Map, Define, Match framework?"
    subtitle: "One pipeline, three steps, four exits"
    baseline_slides: [3]
    content:
      image:
        src: "assets/image3.png"
        alt: "Continuous Purification Pipeline: Map, Define, Match framework with four exits"
        caption: "One pipeline whose exits vary by source type"
      cards:
        - title: "Inputs"
          body: "Accounts from managed sources, plus ISC identities when identity scope is on."
          icon: "database"
        - title: "Order"
          body: "Order is always Map, then Define, then Match; each step can be enabled on its own."
          icon: "layers"
        - title: "Exits"
          body: "Fusion account, review form, automatic merge, or a drop for Records and Orphan."
          icon: "git-branch"
        - title: "Timing"
          body: "Normal definitions feed scoring, unique values are minted after Match decides."
          icon: "clock"
    notes: |
      Order is always Map, then Define, then Match. You can enable one step; you cannot reorder them.
      Inputs are managed sources, plus ISC identities when identity scope is on. Identity scope is optional; often the baseline already lives in your sources.
      After Match there are four exits: Fusion account, review form, automatic merge, or drop for Records and Orphan.

  - slide_number: 4
    layout: "Picture with Caption"
    role: "architecture"
    badge: "Source Matrix"
    title: "Who participates, and in which step?"
    subtitle: "Seeding, scoring, contributing and exiting are four separate questions"
    baseline_slides: [4]
    content:
      image:
        src: "assets/image4.png"
        alt: "Participant lifecycle matrix: identity in scope, correlated managed account, Authoritative, Records, Orphan"
        caption: "Only uncorrelated managed accounts enter Match"
      cards:
        - title: "Seed"
          body: "Seed is who originates the Fusion account, not who merely participates."
          icon: "sparkles"
        - title: "Baseline"
          body: "Baseline is identities in scope, existing Fusion accounts, and already-correlated accounts; Match scores only uncorrelated managed accounts against that set."
          icon: "shield-check"
        - title: "Map & Contribute"
          body: "Map still walks every participating identity and managed account, so contributing attributes is not a Match privilege."
          icon: "share-2"
    notes: |
      Walk the matrix left to right. Seed is who originates the Fusion account, not who merely participates.
      Baseline is identities in scope, existing Fusion accounts, and already-correlated accounts. Only uncorrelated managed accounts enter Match. Map still walks every participant, so contributing attributes is not a Match privilege.
      Records register unique values and emit no Fusion account on a miss. A matching Orphan attaches to an existing identity; a miss is dropped.

  - slide_number: 5
    layout: "Comparison"
    role: "solution"
    badge: "Deployment Topologies"
    title: "Umbrella or side-car?"
    subtitle: "The Fusion source's authority, not whether matching runs"
    baseline_slides: [5]
    content:
      image:
        src: "assets/image5.png"
        alt: "Umbrella Deployment versus Side-car Deployment diagram"
        caption: "Key Distinction: Which box owns identity creation"
      comparison:
        left:
          badge: "Authoritative"
          title: "Umbrella Deployment"
          bullets:
            - "The Fusion source is authoritative and owns create-versus-correlate decisions."
            - "Choose it whenever Fusion itself has to create identities from managed accounts."
            - "Fusion source sits between managed sources and identity creation."
        right:
          badge: "Non-Authoritative"
          title: "Side-car Deployment"
          bullets:
            - "The Fusion source is not authoritative; managed sources still create identities."
            - "Choose it for generated usernames, merged attributes, or supplemental Records and Orphan sources."
            - "Fusion source feeds enriched attributes to existing identities."
    notes: |
      Umbrella versus side-car is the Fusion source Authoritative flag, not whether Match runs. Matching runs in both.
      Use umbrella when Fusion must create identities. Use side-car for generated usernames, merged attributes, or Records and Orphan sources.
      Authoritative, Records, and Orphan name each managed source. Umbrella and side-car name the Fusion source.

  - slide_number: 6
    layout: "Picture with Caption"
    role: "process"
    badge: "Map Engine"
    title: "How does Map resolve conflicting attributes?"
    subtitle: "Schema alignment first, then multi-source personality"
    baseline_slides: [6]
    content:
      image:
        src: "assets/image6.png"
        alt: "Attribute merge resolution from Workday and SuccessFactors into jobTitle"
        caption: "The chosen merge strategy decides how data is consolidated"
      cards:
        - title: "Attribute Normalization"
          body: "Many source names, one Fusion attribute: title, jobTitle and position become jobTitle."
          icon: "git-merge"
        - title: "First Found Strategy"
          body: "First found takes the first non-empty value in the configured source order."
          icon: "list-ordered"
        - title: "List or Concatenate"
          body: "Keep a list or concatenate when a person legitimately has several values."
          icon: "copy"
        - title: "Source Name Priority"
          body: "Source name forces one source to win for an attribute, whatever the order says."
          icon: "shield"
    notes: |
      Map runs first. Many source names become one Fusion attribute. First found takes the first non-empty value in configured source order. Keep a list or concatenate when several values are legitimate.
      Main account uses that snapshot then origin, with no further fallback. Origin account stays on provenance.
      Identity scope adds $identity; the merge walk stays on configured sources.

  - slide_number: 7
    layout: "Title and Content"
    role: "process"
    badge: "Define Engine"
    title: "What does Define compute, and when?"
    subtitle: "Normal attributes before scoring, unique values after"
    baseline_slides: [7]
    content:
      image:
        src: "assets/image7.png"
        alt: "Lifecycle sequence: Map, Normal Define, Match scoring, Unique Define"
        caption: "Unique values are minted only after Match decides"
      cards:
        - title: "1. Map"
          body: "Velocity expressions read mapped values, identity fields, source snapshots and prior state."
          icon: "code"
        - title: "2. Normal Define"
          body: "Normal definitions run before Match, so normalised names and dates improve scoring."
          badge: "Pre-Match"
          icon: "sparkles"
        - title: "3. Match"
          body: "Calculates weighted similarity scores between candidate accounts and baseline identities."
          icon: "target"
        - title: "4. Unique Define"
          body: "Mints usernames, employee numbers, counters, UUIDs. Collisions retry with a counter up to max attempts."
          badge: "Post-Match"
          icon: "hash"
    notes: |
      Normal definitions run after Map and before Match so normalised names and dates improve scoring. Unique definitions run after Match: usernames, employee numbers, counters, UUIDs. Collisions retry with $counter up to the configured maximum attempts.
      Static writes once. Always recalculate runs every aggregation. Empty or failed Normal output clears the stored value; use $previous to keep the last value.

  - slide_number: 8
    layout: "Picture with Caption"
    role: "process"
    badge: "Match Engine"
    title: "What can happen to an account in Match?"
    subtitle: "Four exits, decided against the baseline"
    baseline_slides: [8]
    content:
      image:
        src: "assets/image8.png"
        alt: "Match threshold scoring funnel showing Auto-merge threshold and Review floor"
        caption: "Two thresholds split the score range into three outcomes"
      cards:
        - title: "Automatic Merge"
          body: "Automatic merge when the combined score clears the configured auto-merge threshold."
          badge: "Score >= Auto-merge threshold"
          icon: "check-circle-2"
        - title: "Review Form"
          body: "Review form when the score clears the review floor but not the auto-merge threshold."
          badge: "Review floor <= Score < Auto-merge"
          icon: "user-check"
        - title: "Non-Match Exits"
          body: "Non-match exits by source type: create identity, register value, or drop account."
          badge: "Score < Review floor"
          icon: "x-circle"
    notes: |
      Only uncorrelated managed accounts are scored against the baseline. Combined score at or above auto-merge merges. Between the review floor and auto-merge goes to a form. Below the floor is non-match: create an identity when Fusion is authoritative, or drop for Records and Orphan.
      Deferred candidates: the only match is another new account from the same source in the same run, so identity creation waits for the next aggregation.

  - slide_number: 9
    layout: "Picture with Caption"
    role: "architecture"
    badge: "Scoring Mechanics"
    title: "How is a match score built?"
    subtitle: "Weighted similarity with mandatory rules as vetoes"
    baseline_slides: [9]
    content:
      image:
        src: "assets/image9.png"
        alt: "Worked scoring example table with Enhanced Name Matcher, Binary, Skip if missing, and Mandatory veto"
        caption: "A failed mandatory rule rejects a candidate that clears the combined score"
      cards:
        - title: "Attribute Algorithms"
          body: "Each rule compares one attribute with a chosen algorithm and a threshold."
          icon: "sliders"
        - title: "Threshold as Weight"
          body: "The threshold is also the rule's weight in the combined score."
          icon: "scale"
        - title: "Skip if Missing"
          body: "Skip if missing keeps empty attributes from dragging a score down."
          icon: "minus-circle"
        - title: "Mandatory Veto"
          body: "A failed mandatory rule rejects a candidate that clears the combined score."
          badge: "Absolute Veto"
          icon: "alert-triangle"
    notes: |
      Threshold does double duty: it is the pass mark for that rule and its weight in the sum. Normalised scores add up to a combined score from 0 to 100.
      Mandatory rules act as vetoes: fail any mandatory rule and the candidate is rejected even if the overall score clears the auto-merge threshold.
      Skip if missing keeps missing optional data from dragging a match down.

  - slide_number: 10
    layout: "Two Content"
    role: "governance"
    badge: "Human Governance"
    title: "Where do humans fit in?"
    subtitle: "Reviews are decisions, reports are analysis"
    baseline_slides: [10]
    content:
      image:
        src: "assets/image10.png"
        alt: "Human review workflow from Review form to Assigned reviewer to Decision to Next aggregation"
        caption: "The decision takes effect on the next aggregation, not immediately"
      cards:
        - title: "Manual Reviews"
          body: "A review form shows the top candidates and their attributes to assigned reviewers. Reviewers link to an existing identity or create a new one; the decision applies on the next aggregation."
          badge: "Decision Flow"
          icon: "clipboard-check"
        - title: "Reporters & Reviewers"
          body: "Reviewers are source owners acting globally or per-source reviewer entitlement holders. Fusion reports preview outcomes for analysis without introducing changes."
          badge: "Roles & Safety"
          icon: "users"
    notes: |
      Review forms show the top candidates and their attributes to assigned reviewers. Reviewers link to an existing identity or create a new one; the decision applies on the next aggregation.
      Reviewers are source owners acting globally or per-source reviewer entitlement holders. Fusion reports preview outcomes for analysis without introducing changes.

  - slide_number: 11
    layout: "Title and Content"
    role: "architecture"
    badge: "Correlation Dynamics"
    title: "How is correlation different from matching?"
    subtitle: "Matching asks who this is; correlation is the ISC link"
    baseline_slides: [11]
    content:
      image:
        src: "assets/image11.png"
        alt: "Matching decides who this account is, correlation links account to an ISC identity"
        caption: "Matching decides, correlation links. You cannot link an account to an identity that does not exist yet, so Fusion creates it first."
      cards:
        - title: "Correlate on Aggregation"
          body: "Fusion links missing accounts directly during the run."
          icon: "link-2"
        - title: "Reverse Correlation"
          body: "Fusion writes an attribute that native ISC rules consume instead."
          icon: "corner-up-left"
        - title: "Do Not Correlate"
          body: "Stage the linking work; matching keeps working without it."
          icon: "pause-circle"
        - title: "Enforced Correlation Role"
          body: "ISC later links accounts Fusion staged without correlating."
          icon: "shield-check"
    notes: |
      Matching decides who the account belongs to. Correlation creates the ISC link between the managed account and the identity.
      You cannot link an account to an identity that does not exist yet, so Fusion creates it first.
      Choose among correlate on aggregation, reverse correlation, do not correlate, or enforced correlation role based on tenant policy.

  - slide_number: 12
    layout: "Picture with Caption"
    role: "operations"
    badge: "Operator Model"
    title: "What does a Fusion account give an operator?"
    subtitle: "Standard attributes, entitlements, and fresh source data"
    baseline_slides: [12]
    content:
      image:
        src: "assets/image12.png"
        alt: "Fusion account record with Provenance, Source Data options, and Entitlements"
        caption: "One account record carries provenance and both entitlement families"
      cards:
        - title: "Provenance Tracking"
          body: "Standard attributes trace provenance: contributing accounts, sources, origin, and history. Native identity and account name are set at creation and never rewritten."
          icon: "history"
        - title: "Source Data"
          body: "Source data can be aggregated before processing, after a delay, or not at all."
          icon: "database"
        - title: "Entitlement Families"
          body: "Status entitlements are calculated by the connector. Action entitlements are requestable in ISC."
          icon: "award"
    notes: |
      Standard attributes trace provenance: contributing accounts, sources, origin, and history. Native identity and account name are set at creation and never rewritten.
      Source data can be aggregated before processing, after a delay, or not at all.
      Status entitlements are calculated by the connector; Action entitlements are requestable in ISC.

  - slide_number: 13
    layout: "Four Tiles"
    role: "operations"
    badge: "Operational Tooling"
    title: "What is external processing for?"
    subtitle: "One gateway, four capabilities"
    baseline_slides: [13]
    content:
      image:
        src: "assets/image13.png"
        alt: "External settings gateway branching into Proxy mode, Scenario recording, External logging, Dry-run"
        caption: "One gateway, four capabilities"
      cards:
        - title: "Proxy Mode"
          body: "Proxy mode runs the connector logic on your infrastructure and streams results back to ISC."
          badge: "Infrastructure"
          icon: "server"
        - title: "Scenario Recording"
          body: "Scenario recording captures live API traffic for offline replay and regression tests."
          badge: "Testing"
          icon: "video"
        - title: "External Logging"
          body: "External logging posts from ISC, or writes to disk when proxy mode is on."
          badge: "Observability"
          icon: "file-text"
        - title: "Dry-Run"
          body: "Dry-run runs the whole pipeline with writes suppressed, so nothing touches the tenant."
          badge: "Validation"
          icon: "flask-conical"
    notes: |
      External settings gateway unlocks four key capabilities for enterprise operations:
      Proxy mode runs connector logic locally. Scenario recording captures live API traffic for test automation.
      External logging streams logs to central tooling. Dry-run validates transformations with zero writes.

  - slide_number: 14
    layout: "Picture with Caption"
    role: "extensibility"
    badge: "Developer Seams"
    title: "Where can you plug in your own code?"
    subtitle: "Configuration first, then two override seams: services and operations"
    baseline_slides: [14]
    content:
      image:
        src: "assets/image14.png"
        alt: "Extensibility seams architecture: ISC standard operations -> Override Seam 1 -> Override Seam 2 -> Services -> Exit"
        caption: "Both seams resolve per operation run, so an override stays scoped to that run and never leaks into another"
      cards:
        - title: "Configuration First"
          body: "Configuration covers most needs: attribute mappings, Velocity expressions, match rules and custom Velocity algorithms."
          icon: "settings"
        - title: "Override Seam 1"
          body: "Operation handler picks the route: built-in, your operation override (e.g. accountList), or proxy."
          badge: "Operations"
          icon: "cpu"
        - title: "Override Seam 2"
          body: "Service registry builds this run's services, your service override included (mapping, definition, matching)."
          badge: "Services"
          icon: "box"
    notes: |
      Configuration covers most needs: attribute mappings, Velocity expressions, match rules and custom Velocity algorithms.
      Override a service: ship your own mapping, definition or matching service and the registry wires the rest unchanged.
      Override an operation: replace accountList or any other operation and still receive every service already built.
      Both seams resolve per operation run, so an override stays scoped to that run and never leaks into another.

  - slide_number: 15
    layout: "Four Tiles"
    role: "summary"
    badge: "Adoption Paths"
    title: "Which path is yours?"
    subtitle: "Four starting points, each with a short reading list"
    baseline_slides: [15]
    content:
      image:
        src: "assets/image15.png"
        alt: "Four starting points: HR/AD deduplication, Username/ID pool, Contractor cleanup, Attribute consolidation only"
        caption: "Four starting points, each with a short reading list"
      cards:
        - title: "HR and AD Deduplication"
          body: "Umbrella mode, sources and scope, then matching identities."
          badge: "Umbrella Mode"
          icon: "umbrella"
        - title: "Username or Employee-ID Pool"
          body: "Records source type, then defining attributes."
          badge: "Records Mode"
          icon: "id-card"
        - title: "Contractor Cleanup"
          body: "Orphan source type, then matching identities."
          badge: "Orphan Mode"
          icon: "brush"
        - title: "Attribute Consolidation Only"
          body: "Side-car mode, then mapping attributes."
          badge: "Side-car Mode"
          icon: "layers"
    notes: |
      Four starting points, each with a short reading list:
      1. HR and AD deduplication: umbrella mode, sources and scope, then matching identities.
      2. Username or employee-ID pool: Records source type, then defining attributes.
      3. Contractor cleanup: Orphan source type, then matching identities.
      4. Attribute consolidation only: side-car mode, then mapping attributes.
