type: object
description: |
  A deck spec defines the structure, hierarchy, and content for a presentation.
  Visual appearance is governed by the selected style ('*-design.md') and layout definitions ('Layouts.csv').
  The spec focuses strictly on content semantics, leaving colors, typography scales, and rendering
  rules to the styling engine.
additionalProperties: false
required:
  - title
  - goal
  - slides
properties:
  title:
    type: string
    description: Human-readable presentation title.
  goal:
    type: string
    description: One or two sentences describing what the presentation achieves.
  theme:
    type: string
    description: Name or filename of the style to use (e.g. 'sailpoint-corporate-2026-design').
  logo:
    type: string
    description: Optional custom path to cover brand logo, or 'none' to omit cover logo. Overrides theme default.
  slide_count:
    type: integer
    description: Total number of slides in this specification. Must match the length of the 'slides' array.
  baseline:
    type: string
    description: Modernization only. Path to the baseline .pptx, relative to the spec file (e.g. '../deck.pptx'). Enables engine/check_coverage.py.
  baseline_cuts:
    type: array
    description: Modernization only. Baseline slides or media intentionally NOT carried over. Every entry MUST reflect an explicit user approval at a consensus gate.
    items:
      type: object
      required:
        - reason
      properties:
        slide:
          type: integer
          description: Baseline slide number dropped entirely.
        media:
          type: string
          description: Baseline media filename (e.g. 'image29.png') dropped.
        reason:
          type: string
        approved_by_user:
          type: boolean
  options:
    type: object
    properties:
      language:
        type: string
        description: e.g. 'en', 'es', 'pt'.
      audience:
        type: string
        description: Target audience (e.g. 'Executive leadership', 'DevOps engineers', 'Customers').
      tone:
        type: string
        description: e.g. 'authoritative, concise', 'energetic, visionary'.
      length:
        type: string
        enum:
          - short
          - default
          - long
        description: Target presentation length ('short' = 5-7 slides, 'default' = 8-14, 'long' = 15+).
  slides:
    type: array
    items:
      type: object
      required:
        - slide_number
        - layout
        - role
        - title
        - content
      properties:
        slide_number:
          type: integer
          description: Unique, sequential 1-based index for the slide.
        layout:
          type: string
          description: Must match a 'Layout Name' in Layouts.csv (e.g. 'Title Slide', 'Title and Content', 'Two Content', 'Comparison', 'Section Header', 'Three Columns', 'Four Tiles').
        role:
          type: string
          description: Semantic role (e.g. 'cover', 'problem', 'solution', 'architecture', 'metrics', 'roadmap', 'summary').
        title:
          type: string
          description: Slide heading.
        subtitle:
          type: string
          description: Short supporting subtitle.
        badge:
          type: string
          description: Small category eyebrow or badge tag above the title (e.g. 'Q3 2026', 'Identity Security', 'Milestone').
        content:
          type: object
          properties:
            bullets:
              type: array
              items:
                type: string
              description: Bullet list points.
            body:
              type: string
              description: Paragraph text or narrative copy. On Title Slides, acts as the 1-2 sentence executive abstract or synopsis beneath the title.
            presenter:
              type: string
              description: Presenter name or authoring team for Title Slides (e.g. 'Enterprise IAM Architecture Team'). Renders in the bottom metadata bar.
            date:
              type: string
              description: Presentation date or year for Title Slides (e.g. '2026', 'Q3 2026'). Renders in the bottom metadata bar.
            metrics:
              type: array
              items:
                type: object
                required:
                  - value
                  - label
                properties:
                  value:
                    type: string
                    description: The stat or metric (e.g. '10x', '99.9%', '$4.2M').
                  label:
                    type: string
                    description: Label explaining the stat.
                  subtext:
                    type: string
                    description: Context or delta (e.g. '+24% YoY').
                  highlight:
                    type: boolean
                    description: Whether to emphasize with the vivid accent glow (accent-alt). Use strictly for items of higher relevance or priority. Do NOT mix and match accents when sibling elements have equal weight.
                  icon:
                    type: string
                    description: Lucide icon name (e.g. 'trending-up', 'zap', 'shield-check', 'gauge', 'users').
            cards:
              type: array
              items:
                type: object
                required:
                  - title
                  - body
                properties:
                  title:
                    type: string
                  body:
                    type: string
                  icon:
                    type: string
                    description: Lucide icon name or variant (e.g. 'shield-check', 'user-round', 'key-round', 'database', 'cpu', 'cloud', 'bot').
                  badge:
                    type: string
                  highlight:
                    type: boolean
                    description: Whether to emphasize with the vivid accent glow (accent-alt). Use strictly for items of higher relevance or priority. Do NOT mix and match accents when sibling elements have equal weight.
            regions:
              type: array
              description: Content blocks mapped to layout regions/columns.
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: "Region identifier (e.g. 'left', 'right', 'col1', 'col2', 'col3', 'sidebar', etc.)."
                  title:
                    type: string
                  kind:
                    type: string
                    enum:
                      - text
                      - cards
                      - media
                  bullets:
                    type: array
                    items:
                      type: string
                  body:
                    type: string
                  media_ref:
                    type: string
            comparison:
              type: object
              description: Side-by-side comparison structure.
              properties:
                left:
                  type: object
                  properties:
                    title:
                      type: string
                    badge:
                      type: string
                    bullets:
                      type: array
                      items:
                        type: string
                right:
                  type: object
                  properties:
                    title:
                      type: string
                    badge:
                      type: string
                    bullets:
                      type: array
                      items:
                        type: string
            diagram:
              type: object
              description: |
                Structural intent for an architectural diagram or process flow.
                Standard: Use high-fidelity SVG diagrams ('svg', 'src') or native architecture components ('pipeline', 'convergence', 'cardinality', 'policy_flow', 'layered_stack').
                Embedded Mermaid is discouraged due to unpredictable layout and low contrast in dark presentations.
              properties:
                kind:
                  type: string
                  enum:
                    - svg
                    - pipeline
                    - convergence
                    - cardinality
                    - policy_flow
                    - layered_stack
                    - flow
                    - comparison
                    - matrix
                    - funnel
                    - timeline
                    - hierarchy
                    - cards
                    - mermaid
                title:
                  type: string
                  description: Diagram title displayed in the component header.
                badge:
                  type: string
                  description: Optional badge tag in the diagram header.
                svg:
                  type: string
                  description: Inline SVG markup for the diagram.
                src:
                  type: string
                  description: Relative path to an SVG diagram asset (e.g. 'assets/pipeline_architecture.svg').
                elements:
                  type: array
                  items:
                    type: string
                connections:
                  type: array
                  items:
                    type: string
                mermaid:
                  type: string
                  description: Deprecated. Raw Mermaid syntax. Prefer SVG diagrams or native architecture components.
                emphasis:
                  type: string
            chart:
              type: object
              description: |
                Declarative data visualization chart powered by reveal.js-plugins/chart and Chart.js.
                Preferred standard for presenting quantitative datasets, multi-quarter trends, and categorical shares.
              required:
                - type
                - datasets
              properties:
                type:
                  type: string
                  enum:
                    - bar
                    - line
                    - pie
                    - doughnut
                    - radar
                    - polarArea
                  description: Chart type.
                labels:
                  type: array
                  items:
                    type: string
                  description: Categorical labels for data points (X-axis categories or circular slices).
                datasets:
                  type: array
                  items:
                    type: object
                    required:
                      - data
                    properties:
                      label:
                        type: string
                        description: Series label displayed in legend and tooltips.
                      data:
                        type: array
                        items:
                          type: number
                        description: Numerical data values for the series.
                      color:
                        type: string
                        description: Theme token ('accent', 'accent-alt') or color string.
                      fill:
                        type: boolean
                        description: Whether to fill the area under line charts.
                options:
                  type: object
                  description: Optional Chart.js overrides (e.g. stacked, legend, cutout).
            svg:
              type: string
              description: Standalone inline SVG markup for rich architectural diagrams or flowcharts.
            mermaid:
              type: string
              description: Deprecated. Prefer SVG diagrams ('svg', 'diagram.src') or native architecture components.
            image:
              type: object
              description: |
                Single visual asset (generated illustration, architectural diagram, or screenshot) embedded in the slide.
                RULE: Icons must remain small (24px-48px). NEVER use an icon as a large picture or cover hero graphic.
                When needing a picture to represent something bigger (e.g. cover slide or hero visual), generate one using generate_image.
                Never recycle legacy slide master backgrounds or template stock photos as cover hero graphics (record those in baseline_cuts instead).
              required:
                - src
              properties:
                src:
                  type: string
                  description: Relative path to the image asset (e.g. 'assets/cover_hero.jpg').
                alt:
                  type: string
                  description: Image description.
                caption:
                  type: string
                  description: Optional caption or subtitle beneath the image.
            media:
              type: array
              items:
                type: object
                required:
                  - name
                  - source
                properties:
                  name:
                    type: string
                  source:
                    type: string
                  alt:
                    type: string
        notes:
          type: string
          description: Presenter notes visible in speaker view.
        baseline_slides:
          type: array
          items:
            type: integer
          description: Modernization only. Baseline slide numbers this slide carries. REQUIRED for every slide unless 'new' is true.
        new:
          type: boolean
          description: Modernization only. True when the slide has no baseline counterpart (must have been approved by the user).
        redrawn_media:
          type: array
          items:
            type: string
          description: Modernization only. Baseline media filenames faithfully reproduced as an SVG/native component on this slide instead of being embedded.
        additions:
          type: array
          items:
            type: string
          description: Modernization only. Facts, names, or claims on this slide that are NOT in the baseline (e.g. vendor names, examples). Surfaced to the user at the review gate; anything not listed is assumed to come from the baseline.