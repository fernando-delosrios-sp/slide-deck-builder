type: object
description: |
  A deck spec defines the structure, hierarchy, and content for a presentation.
  Visual appearance is governed by the selected style ('*-design.md') and layout definitions ('Layouts.csv').
  The spec focuses strictly on content semantics, leaving colors, typography scales, and rendering
  rules to the styling engine.
additionalProperties: false
required:
  - title
  - goal
  - slides
properties:
  title:
    type: string
    description: Human-readable presentation title.
  goal:
    type: string
    description: One or two sentences describing what the presentation achieves.
  theme:
    type: string
    description: Name or filename of the style to use (e.g. 'sailpoint-corporate-2026-design').
  slide_count:
    type: integer
    description: Total number of slides in this specification. Must match the length of the 'slides' array.
  options:
    type: object
    properties:
      language:
        type: string
        description: e.g. 'en', 'es', 'pt'.
      audience:
        type: string
        description: Target audience (e.g. 'Executive leadership', 'DevOps engineers', 'Customers').
      tone:
        type: string
        description: e.g. 'authoritative, concise', 'energetic, visionary'.
      length:
        type: string
        enum:
          - short
          - default
          - long
        description: Target presentation length ('short' = 5-7 slides, 'default' = 8-14, 'long' = 15+).
  slides:
    type: array
    items:
      type: object
      required:
        - slide_number
        - layout
        - role
        - title
        - content
      properties:
        slide_number:
          type: integer
          description: Unique, sequential 1-based index for the slide.
        layout:
          type: string
          description: Must match a 'Layout Name' in Layouts.csv (e.g. 'Title Slide', 'Title and Content', 'Two Content', 'Comparison', 'Section Header', 'Three Columns', 'Four Tiles').
        role:
          type: string
          description: Semantic role (e.g. 'cover', 'problem', 'solution', 'architecture', 'metrics', 'roadmap', 'summary').
        title:
          type: string
          description: Slide heading.
        subtitle:
          type: string
          description: Short supporting subtitle.
        badge:
          type: string
          description: Small category eyebrow or badge tag above the title (e.g. 'Q3 2026', 'Identity Security', 'Milestone').
        content:
          type: object
          properties:
            bullets:
              type: array
              items:
                type: string
              description: Bullet list points.
            body:
              type: string
              description: Paragraph text or narrative copy.
            metrics:
              type: array
              items:
                type: object
                required:
                  - value
                  - label
                properties:
                  value:
                    type: string
                    description: The stat or metric (e.g. '10x', '99.9%', '$4.2M').
                  label:
                    type: string
                    description: Label explaining the stat.
                  subtext:
                    type: string
                    description: Context or delta (e.g. '+24% YoY').
                  highlight:
                    type: boolean
                    description: Whether to emphasize with accent glow.
            cards:
              type: array
              items:
                type: object
                required:
                  - title
                  - body
                properties:
                  title:
                    type: string
                  body:
                    type: string
                  icon:
                    type: string
                    description: Semantic icon name (e.g. 'shield', 'key', 'cloud', 'chart', 'user').
                  badge:
                    type: string
                  highlight:
                    type: boolean
            regions:
              type: array
              description: Content blocks mapped to layout regions/columns.
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: 'left', 'right', 'col1', 'col2', 'col3', 'sidebar', etc.
                  title:
                    type: string
                  kind:
                    type: string
                    enum:
                      - text
                      - cards
                      - media
                  bullets:
                    type: array
                    items:
                      type: string
                  body:
                    type: string
                  media_ref:
                    type: string
            comparison:
              type: object
              description: Side-by-side comparison structure.
              properties:
                left:
                  type: object
                  properties:
                    title:
                      type: string
                    badge:
                      type: string
                    bullets:
                      type: array
                      items:
                        type: string
                right:
                  type: object
                  properties:
                    title:
                      type: string
                    badge:
                      type: string
                    bullets:
                      type: array
                      items:
                        type: string
            diagram:
              type: object
              description: Structural intent for a diagram or process flow.
              required:
                - kind
                - elements
              properties:
                kind:
                  type: string
                  enum:
                    - flow
                    - comparison
                    - matrix
                    - funnel
                    - timeline
                    - hierarchy
                    - cards
                elements:
                  type: array
                  items:
                    type: string
                connections:
                  type: array
                  items:
                    type: string
                emphasis:
                  type: string
            image:
              type: object
              description: Single visual asset (illustration, diagram, or screenshot) embedded in the slide.
              required:
                - src
              properties:
                src:
                  type: string
                  description: Relative path to the image asset (e.g. 'assets/pipeline_architecture.png').
                alt:
                  type: string
                  description: Image description.
                caption:
                  type: string
                  description: Optional caption or subtitle beneath the image.
            media:
              type: array
              items:
                type: object
                required:
                  - name
                  - source
                properties:
                  name:
                    type: string
                  source:
                    type: string
                  alt:
                    type: string
        notes:
          type: string
          description: Presenter notes visible in speaker view.