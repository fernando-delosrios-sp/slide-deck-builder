type: object
description: |
  A deck spec carries structure and content only. Visual appearance comes from the
  single enabled '*-design.md' style source at generation time, so this schema has no
  style, theme, colour or font field, and no field may describe an appearance.
additionalProperties: false
required:
  - title
  - goal
  - slides
properties:
  title:
    type: string
    description: Human-readable deck title.
  goal:
    type: string
    description: One or two sentences describing what the deck should achieve.
  options:
    type: object
    properties:
      language:
        type: string
        description: e.g. 'en', 'es', 'pt'.
      audience:
        type: string
        description: who this is for.
      tone:
        type: string
        description: short description, e.g. 'confident, concise'.
      length:
        type: string
        enum:
          - short
          - default
          - long
        description: |
          one of:
          - 'short' - ~5-7 slides
          - 'default' - ~8-14 slides
          - 'long' - 15+ slides
  slides:
    type: array
    items:
      type: object
      required:
        - slide_number
        - layout
        - role
        - title
        - content
      properties:
        slide_number:
          type: integer
          description: A unique, sequential index for this slide starting at 1. Acts as a strict boundary guardrail between slides.
        layout:
          type: string
          description: |
            Must match 'Layout Name' in 'Layouts'. Examples:
            - 'Title Slide'
            - 'Title and Content'
            - 'Section Header'
            - 'Two Content'
            - 'Comparison'
            - 'Title Only'
            - 'Blank'
            - 'Content with Caption'
            - 'Picture with Caption'
        role:
          type: string
          description: Free-form semantic tag, e.g. 'cover', 'problem', 'solution', 'metrics', 'roadmap', 'summary'.
        title:
          type: string
          description: Slide heading.
        subtitle:
          type: string
          description: Short supporting line for title (where layout supports it).
        content:
          type: object
          properties:
            bullets:
              type: array
              items:
                type: string
              description: bullet list for single-column layouts.
            body:
              type: string
              description: paragraph text.
            regions:
              type: array
              description: used for multi-column layouts
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: e.g. 'left', 'right'.
                  kind:
                    type: string
                    enum:
                      - text
                      - media
                  bullets:
                    type: array
                    items:
                      type: string
                    description: For 'text' regions.
                  media_ref:
                    type: string
                    description: name of a media item, for 'media' regions.
            diagram:
              type: object
              description: |
                Structural intent for one drawing on this slide. Says what the picture
                shows; the enabled style decides strokes, colours, icons and depth.
              required:
                - kind
                - elements
              properties:
                kind:
                  type: string
                  enum:
                    - flow
                    - comparison
                    - matrix
                    - funnel
                    - timeline
                    - hierarchy
                    - cards
                  description: |
                    Picture type. 'elements' stay a flat list of strings; the prefix
                    and delimiter inside each string depend on 'kind':
                    - 'flow' - ordered steps with inputs and exits. Each element is
                      one node in reading order. Prefix terminals 'Exit: '. Write
                      'connections' as 'A -> B'.
                    - 'comparison' - two alternatives side by side. Prefix every
                      element with its side ('Without Fusion: …', 'Umbrella: …') so
                      the two columns parse without a separate grouping field.
                    - 'matrix' - rows scored against columns. First element is
                      'Header: <row-key> | <col> | <col> | …'. Each following
                      element is 'Record: <row-label> | <cell> | <cell> | …' with
                      the same column count. Pipes are cell delimiters, not markdown
                      table fences; no leading or trailing '|'. Every scored cell
                      belongs on a Record; do not list axis names alone and leave
                      the generator to invent yes/no, scores or phrases.
                    - 'funnel' - candidates narrowing to outcomes. Elements run
                      wide to narrow; the first is the intake, later ones are
                      successive splits or exits.
                    - 'timeline' - events or phases along an axis. Elements are
                      chronological; 'connections' chain them in that order.
                    - 'hierarchy' - layers or containment. The first element is
                      the root; the rest are children. 'connections' are
                      'parent -> child' or 'parent -> each of …'.
                    - 'cards' - a grid of peer items. One element per card; no
                      ranking. Omit 'connections'.
                elements:
                  type: array
                  items:
                    type: string
                  description: |
                    Labelled parts of the drawing, in reading order, using the
                    per-kind prefixes under 'kind'. Values are facts (names,
                    yes/no, scores, short phrases), never appearance (colours,
                    icons, stroke, layout).
                connections:
                  type: array
                  items:
                    type: string
                  description: |
                    Relationships between elements, e.g. 'Map -> Define'. Required
                    on a 'flow' that branches, merges or exits, and useful for
                    'comparison', 'funnel', 'timeline' and 'hierarchy'. A strictly
                    sequential flow may omit them: 'elements' already carry reading
                    order. Omit on 'cards'. On 'matrix' omit unless a relationship
                    outside the grid must be drawn.
                emphasis:
                  type: string
                  description: The single element or relationship the slide argues for.
            media:
              type: array
              items:
                type: object
                required:
                  - name
                  - source
                properties:
                  name:
                    type: string
                    description: identifier used in 'media_ref'.
                  source:
                    type: string
                    description: URL or Drive ID.
                  alt:
                    type: string
                    description: alt text.
        notes:
          type: string
          description: |
            What the presenter says while this slide is up: background, caveats, links.
            Diagram intent belongs in 'content.diagram'; appearance belongs to the style.