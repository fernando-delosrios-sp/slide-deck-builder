<div class="native-arch-wrapper svg-arch-wrapper{% if not show_header %} no-header{% endif %}">
    {% if show_header %}
    <div class="native-arch-header">
        <span class="native-arch-title"><span class="arch-icon">⬡</span> {{ diag_title }}</span>
        {% if badge_text %}<span class="native-arch-badge">{{ badge_text }}</span>{% endif %}
    </div>
    {% endif %}
    <div class="arch-svg-diagram-canvas">
        {{ svg_markup | safe }}
    </div>
</div>
