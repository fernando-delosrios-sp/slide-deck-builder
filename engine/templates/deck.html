<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ deck_title }}</title>

    <!-- Export / Print Mode Detection -->
    <script>
        (function() {
            var search = window.location.search;
            var isExport = search.indexOf('export=pdf') !== -1 ||
                           search.indexOf('print-pdf') !== -1 ||
                           /HeadlessChrome/i.test(navigator.userAgent);
            if (isExport) {
                document.documentElement.classList.add('export-pdf', 'print-pdf');
            }
        })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family={{ google_font }}&display=swap" rel="stylesheet">

    <!-- Reveal.js Stylesheets -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/reset.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/reveal.min.css">
    <link rel="stylesheet" href="{{ reveal_theme_css }}">

    <!-- Deck Theme & Layout CSS -->
    <style>
{{ deck_css | safe }}
    </style>
</head>
<body>
    <div class="reveal">
        <div class="slides">
{{ slides_content | safe }}
        </div>
    </div>

    <!-- Reveal.js Engine & Plugins -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/reveal.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/plugin/notes/notes.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js-plugins@latest/chart/plugin.js"></script>
    <script>
        const isPdfExport = window.location.search.includes('export=pdf') || 
                             window.location.search.includes('print-pdf') || 
                             document.documentElement.classList.contains('reveal-print');
        if (isPdfExport && window.Chart) {
            Chart.defaults.animation = false;
            document.querySelectorAll('canvas[data-chart]').forEach(canvas => {
                for (let node of canvas.childNodes) {
                    if (node.nodeType === Node.COMMENT_NODE) {
                        try {
                            let json = JSON.parse(node.nodeValue);
                            json.options = json.options || {};
                            json.options.animation = false;
                            node.nodeValue = JSON.stringify(json);
                        } catch(e) {}
                    }
                }
            });
        }
    </script>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        
        mermaid.initialize({
            startOnLoad: false,
            theme: 'base',
            flowchart: {
                useMaxWidth: true,
                htmlLabels: true,
                curve: 'basis'
            },
            themeVariables: {
                darkMode: {{ 'true' if mode == 'dark' else 'false' }},
                background: '{{ card_bg }}',
                primaryColor: '{{ surface_color }}',
                primaryBorderColor: '{{ accent_color }}',
                primaryTextColor: '{{ ink_color }}',
                lineColor: '{{ accent_color }}',
                secondaryColor: '{{ surface_soft }}',
                tertiaryColor: '{{ bg_color }}'
            }
        });

        Reveal.initialize({
            hash: true,
            slideNumber: 'c/t',
            width: 1920,
            height: 1080,
            margin: 0.04,
            minScale: 0.2,
            maxScale: 2.0,
            transition: 'slide',
            plugins: [ RevealNotes, RevealChart ],
            chart: {
                defaults: {
                    color: '{{ ink_muted }}',
                    font: {
                        family: {{ font_family | tojson }}
                    },
                    scale: {
                        grid: {
                            color: '{{ card_border }}'
                        },
                        ticks: {
                            color: '{{ ink_muted }}'
                        }
                    }
                },
                line: {
                    borderColor: [ "{{ accent_color }}", "{{ accent_alt }}", "#10B981", "#F59E0B", "#8B5CF6" ]
                },
                bar: {
                    backgroundColor: [ "{{ accent_color }}", "{{ accent_alt }}", "#10B981", "#F59E0B", "#8B5CF6" ]
                },
                pie: {
                    backgroundColor: [ [ "{{ accent_color }}", "{{ accent_alt }}", "#10B981", "#F59E0B", "#8B5CF6", "#EC4899" ] ]
                }
            }
        }).then(() => {
            mermaid.run();
        });

        Reveal.on('slidechanged', () => {
            window.dispatchEvent(new Event('resize'));
        });
    </script>

    <!-- Image Lightbox Modal Overlay (Click-to-Zoom in Foreground) -->
    <div id="image-lightbox-modal" class="image-lightbox-overlay" aria-hidden="true">
        <div class="image-lightbox-backdrop"></div>
        <div class="image-lightbox-content">
            <button class="image-lightbox-close" aria-label="Close image" title="Close (Esc)">&times;</button>
            <img id="image-lightbox-img" src="" alt="Enlarged view" />
            <div id="image-lightbox-caption" class="image-lightbox-caption"></div>
        </div>
    </div>

    <!-- Interactive Image Lightbox Controller -->
    <script>
        (function() {
            const modal = document.getElementById('image-lightbox-modal');
            if (!modal) return;
            const modalImg = document.getElementById('image-lightbox-img');
            const modalCaption = document.getElementById('image-lightbox-caption');
            const closeBtn = modal.querySelector('.image-lightbox-close');
            const backdrop = modal.querySelector('.image-lightbox-backdrop');

            function openLightbox(src, alt, caption) {
                if (!src) return;
                modalImg.src = src;
                modalImg.alt = alt || 'Enlarged image';
                modalCaption.textContent = caption || alt || '';
                modal.style.display = 'flex';
                requestAnimationFrame(() => {
                    modal.classList.add('active');
                });
                modal.setAttribute('aria-hidden', 'false');
                if (window.Reveal) {
                    window.Reveal.configure({ keyboard: false });
                }
            }

            function closeLightbox() {
                modal.classList.remove('active');
                modal.setAttribute('aria-hidden', 'true');
                setTimeout(() => {
                    if (!modal.classList.contains('active')) {
                        modal.style.display = 'none';
                        modalImg.src = '';
                        modalCaption.textContent = '';
                    }
                }, 250);
                if (window.Reveal) {
                    window.Reveal.configure({ keyboard: true });
                }
            }

            document.addEventListener('click', function(e) {
                // Match any embedded slide image (exclude logo or UI controls)
                const targetImg = e.target.closest('.slide-embedded-image, .region-image, .picture-caption-img, .slide-image-card img, .slide-image-wrapper img, .cover-hero-image');
                if (targetImg && targetImg.src && !modal.contains(targetImg)) {
                    e.preventDefault();
                    e.stopPropagation();
                    let caption = '';
                    const captionEl = targetImg.closest('.slide-image-wrapper, .region-image-wrapper, .picture-side, .slide-split-media, .slide-center-media')?.querySelector('.slide-image-caption, .caption-text, figcaption');
                    if (captionEl) {
                        caption = captionEl.textContent.trim();
                    }
                    openLightbox(targetImg.src, targetImg.alt, caption);
                }
            });

            if (closeBtn) closeBtn.addEventListener('click', closeLightbox);
            if (backdrop) backdrop.addEventListener('click', closeLightbox);

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modal.classList.contains('active')) {
                    e.preventDefault();
                    e.stopPropagation();
                    closeLightbox();
                }
            });
        })();
    </script>
</body>
</html>
